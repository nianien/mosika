 var(--border);background:#fff;color:#54706a;font-size:var(--fs-meta);cursor:pointer}.chip.on{background:var(--soft);border-color:#9fd8cf;color:var(--teal-d);font-weight:600}.panel{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden}.scroll{overflow-x:auto}table{width:100%;min-width:950px;border-collapse:collapse;font-size:var(--fs-base)}th{text-align:left;padding:13px 18px;color:var(--muted);font-size:var(--fs-meta);background:#f4faf9;border-bottom:1px solid var(--border)}td{padding:14px 18px;border-bottom:1px solid #eef4f2;vertical-align:middle}.path{font-weight:600;font-size:var(--fs-base);font-family:var(--ff-mono);color:#086b60}.desc{color:#71887f;font-size:var(--fs-minor);margin-top:4px}.actions{gap:11px;justify-content:flex-end}.empty{padding:60px 20px;text-align:center;color:#8aa39d}.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#123038;color:#fff;padding:10px 18px;border-radius:10px;font-size:var(--fs-base);opacity:0;transition:.2s;pointer-events:none;z-index:20}.toast.show{opacity:.95}dialog{border:0;border-radius:16px;padding:0;margin:auto;width:min(880px,96vw);box-shadow:0 24px 70px rgba(18,48,56,.28)}dialog::backdrop{background:rgba(18,48,56,.32)}.dlg-head{padding:22px 24px 0}.dlg-title{font-size:var(--fs-title);font-weight:700}.dlg-sub{margin-top:6px;font-size:var(--fs-meta);color:var(--muted);line-height:1.55}.dlg-body{padding:18px 24px 4px;display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;align-items:stretch;max-height:80vh;overflow-y:auto}.dlg-body>.field.span-2{grid-column:1/-1}.dlg-body>.field{display:flex;flex-direction:column;height:100%}.dlg-body>.field>.hint{margin-top:auto;padding-top:6px}.field label{display:block;font-size:var(--fs-meta);color:#3f5c56;margin-bottom:7px;font-weight:600}.field .req{color:#e0654e;margin-left:2px}.field-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.field-bar label{margin-bottom:0}.field-tools{display:flex;align-items:center;gap:12px}.mini-btn{height:26px;padding:0 12px;border:1px solid var(--border);border-radius:7px;background:#fff;color:#2c5049;font-size:var(--fs-minor);cursor:pointer;transition:.15s}.mini-btn:hover{border-color:var(--teal);color:var(--teal-d);background:var(--soft)}.field input,.field textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:var(--fs-field);color:#123038;background:#fff;font-family:inherit}.field input:focus,.field textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--soft)}.hint{font-size:var(--fs-caption);color:#8aa39d;line-height:1.55;margin-top:6px}.call{font-family:var(--ff-mono);color:#0b6274}.CodeMirror{border:1px solid var(--border);border-radius:9px;height:auto;min-height:64px;font-size:var(--fs-base);font-family:var(--ff-mono)}.CodeMirror-scroll{max-height:320px}.CodeMirror-lint-markers{width:16px}.dlg-foot{padding:14px 24px 22px;display:flex;align-items:center;justify-content:flex-end;gap:10px}.foot-btns{display:flex;gap:10px}.src-status{font-size:var(--fs-minor);font-weight:600;display:flex;align-items:center;gap:6px}.src-status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.src-status.ok{color:#1f9d5c}.src-status.warn{color:#c68a11}.src-status.err{color:#d64545}.detail-dialog{width:min(760px,96vw)}.detail-body{display:block;padding-bottom:8px}.detail-label{font-size:var(--fs-meta);font-weight:600;color:#3f5c56;margin-bottom:7px}.detail-value{font-family:var(--ff-mono);font-size:var(--fs-base);color:#0b6274;overflow-wrap:anywhere}.method-list{display:grid;gap:10px;margin-top:8px}.method-item{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:#f8fbfa}.method-signature{font-family:var(--ff-mono);font-size:var(--fs-base);color:#086b60;overflow-wrap:anywhere}.method-description{font-size:var(--fs-minor);color:#71887f;margin-top:6px}.js-description{color:#71887f;font-size:var(--fs-base);line-height:1.6}.js-source-detail{margin-top:8px;border:1px solid var(--border);border-radius:10px;padding:14px;background:#f8fbfa;color:#0b6274;font-family:var(--ff-mono);font-size:var(--fs-base);line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.btn:disabled{opacity:.5;cursor:not-allowed}@media(max-width:800px){.main{padding:16px 12px}.head{align-items:flex-start;flex-direction:column;gap:12px}.dlg-body{grid-template-columns:1fr}.dlg-body>.field.span-2{grid-column:1}}
.impl-kind{display:inline-block;padding:3px 9px;border-radius:11px;font-size:var(--fs-label);font-weight:600}.impl-kind.java{color:#35685e;background:#e8f4f1}.impl-kind.javascript{color:#0b6274;background:#e3fafd}.detail-grid{display:grid;grid-template-columns:150px 1fr;gap:18px}.detail-grid .detail-label{margin-bottom:7px}@media(max-width:600px){.detail-grid{grid-template-columns:1fr}}

<body class="control-page">
<div class="shell">
  <header class="topbar">
    <div class="brandwrap"><a class="brand brand-home" href="/" aria-label="返回 Mosika 首页"><div class="brand-mark"><img src="/ui/logo.svg" alt=""></div><b>Mosika</b></a><div id="nsSlot"></div><nav class="tabs"><a class="tab" href="/scenes">业务场景</a><a class="tab" href="/rules">业务规则</a><a class="tab on" href="/udfs">自定义函数</a></nav></div>
    <div class="top-actions"><div class="search">🔍 <input id="search" placeholder="搜索调用路径 / 描述 / 代码"></div><button class="btn primary" id="createBtn">＋ 新建函数</button></div>
  </header>
  <main class="main">
    <section class="panel"><div class="scroll"><table><thead><tr><th style="width:68%">调用路径 / 描述</th><th style="width:14%">类型</th><th style="text-align:right">操作</th></tr></thead><tbody id="rows"><tr><td colspan="3"><div class="empty">加载中…</div></td></tr></tbody></table></div><div class="pager" id="pager"></div></section>
  </main>
</div>
<dialog id="dialog"><div class="dlg-head"><div class="dlg-title" id="dlgTitle">新建自定义函数</div></div><div class="dlg-body">
  <div class="field"><label>函数分组</label><input id="group" placeholder="例如 content.delivery"><div class="hint">使用英文句点分隔层级；<code>sys</code> 为系统保留分组。</div></div>
  <div class="field"><label>函数名称<span class="req">*</span></label><input id="name" placeholder="例如 publish"><div class="hint">调用路径：<span class="call" id="callPreview">publish(...)</span></div></div>
  <div class="field"><label>功能说明</label><input id="description" placeholder="例如：发布已通过门禁校验的内容"></div>
  <div class="field span-2"><div class="field-bar"><label>函数实现<span class="req">*</span></label><div class="field-tools"><span class="src-status ok" id="srcStatus">语法有效</span><button type="button" class="mini-btn" id="format">格式化</button></div></div><textarea id="source"></textarea><div class="hint">请输入 JavaScript 函数表达式，支持箭头函数、匿名函数和具名函数。</div></div>
</div><div class="dlg-foot"><button class="btn" id="cancel">取消</button><button class="btn primary" id="save">保存</button></div></dialog>
<dialog id="javaDialog" class="detail-dialog"><div class="dlg-head"><div class="dlg-title" id="javaTitle"></div></div><div class="dlg-body detail-body">
  <div class="detail-grid"><div><div class="detail-label">实现类型</div><div class="detail-value" id="javaKind"></div></div><div><div class="detail-label">实现类</div><div class="detail-value" id="javaImplementation"></div></div></div>
  <div class="detail-label" style="margin-top:18px">方法签名</div><div class="method-list" id="javaMethods"></div>
</div><div class="dlg-foot"><button class="btn" id="javaClose">关闭</button></div></dialog>
<dialog id="jsDialog" class="detail-dialog"><div class="dlg-head"><div class="dlg-title" id="jsTitle"></div></div><div class="dlg-body detail-body">
  <div class="detail-label">功能说明</div><div class="js-description" id="jsDescription"></div>
  <div class="detail-label" style="margin-top:18px">函数实现</div><pre class="js-source-detail" id="jsSource"></pre>
</div><div class="dlg-foot"><button class="btn" id="jsClose">关闭</button></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/ui/ui-common.js?v=20260824-1"></script>
<script src="/ui/code-editor.js?v=20260813-1"></script>
<script src="/ui/api.js?v=20260813-1"></script>
<script src="/ui/ns.js?v=20260813-1"></script>
<script>
(() => {
  "use strict";
  const Api=window.MosikaApi,Ns=window.MosikaNs,Ui=window.MosikaUi,Code=window.MosikaCode,$=Ui.$,esc=Ui.escapeHtml;
  let keyword="",items=[],editing=null,editor=null,seq=0;
  const pager=Ui.createPager("#pager",load);
  const toast=Ui.createToast("#toast",{duration:2200});
  const fullName=(u)=>u.group?`${u.group}.${u.name}`:u.name;
  const implementationLabel=(u)=>u.implementationKind==='function'?'Java Function':'Java Bean';
  const methodParameters=(method)=>(method.parameterTypes||[]).map((type,index)=>{
    const displayType=method.varArgs&&index===method.parameterTypes.length-1?(type.endsWith('[]')?type.slice(0,-2):type)+'...':type;
    const name=(method.parameterNames||[])[index];
    return name?`${name}: ${displayType}`:displayType
  });
  const callableName=(u,method)=>method.name==='apply'?u.name:`${u.name}.${method.name}`;
  const callablePath=(u,method)=>u.group?`${u.group}.${callableName(u,method)}`:callableName(u,method);
  const methodSignature=(u,method)=>`${callablePath(u,method)}(${methodParameters(method).join(', ')}) → ${method.returnType}`;
  const javascriptParameter=(parameter)=>{
    if(parameter.type==='Identifier')return parameter.name;
    if(parameter.type==='RestElement')return `...${javascriptParameter(parameter.argument)}`;
    if(parameter.type==='AssignmentPattern')return javascriptParameter(parameter.left);
    if(parameter.type==='ObjectPattern')return '{…}';
    if(parameter.type==='ArrayPattern')return '[…]';
    return '…'
  };
  const javascriptSignature=(u)=>{
    const parsed=Code.parseExpression(u.source),expression=parsed.ok&&parsed.expression;
    const parameters=expression&&Array.isArray(expression.params)?expression.params.map(javascriptParameter):['…'];
    return `${fullName(u)}(${parameters.join(', ')})`
  };
  async function load(){const current=++seq;$("#rows").innerHTML='<tr><td colspan="3"><div class="empty">加载中…</div></td></tr>';try{const p=await Api.listUdfs({status:1,keyword,pageNumber:pager.pageNumber,pageSize:pager.pageSize,namespace:Ns.code()});if(current!==seq)return;items=p.items||[];if(pager.update(p.total||0))return load();render();}catch(e){$("#rows").innerHTML=`<tr><td colspan="3"><div class="empty">加载失败：${esc(e.message)}</div></td></tr>`;pager.hide()}}
  function render(){
    $("#rows").innerHTML=items.length?items.map((u,index)=>{
      const javaUdf=u.type==='java'||u.editable===false;
      const method=javaUdf?(u.methods||[])[0]:null;
      const identity=`#${u.id}`;
      const actions=javaUdf
        ?`<button class="btn link" data-view="${index}">查看</button>`
        :`<button class="btn link" data-edit="${u.id}">编辑</button><button class="btn link" data-js-view="${index}">查看</button>`;
      const signature=javaUdf&&method?methodSignature(u,method):javascriptSignature(u);
      const path=javaUdf&&method?callablePath(u,method):fullName(u);
      const description=javaUdf&&method?method.description:u.description;
      const detail=`<div class="desc">${esc(description||'—')}${javaUdf?'':` · ${identity}`}</div>`;
      const implementation=`<span class="impl-kind ${javaUdf?'java':'javascript'}">${javaUdf?'Java':'JavaScript'}</span>`;
      return `<tr><td><div class="path" title="${esc(path)}">${esc(signature)}</div>${detail}</td><td>${implementation}</td><td><div class="actions">${actions}</div></td></tr>`
    }).join(''):'<tr><td colspan="3"><div class="empty">暂无自定义函数</div></td></tr>';
  }
  function lintSource(text){
    const anns=[],src=String(text||'').trim();
    if(!src){updateStatus(anns,true);return anns}
    try{
      const parsed=Code.parseExpression(src);
      if(!parsed.ok)throw parsed.error||new Error(parsed.message);
      const expr=parsed.expression,t=expr&&expr.type;
      const funcish=['FunctionExpression','ArrowFunctionExpression','CallExpression','ConditionalExpression','LogicalExpression','MemberExpression'];
      if(t&&funcish.indexOf(t)<0)anns.push({message:'函数实现必须为可调用的 JavaScript 表达式。',severity:'warning',from:CodeMirror.Pos(0,0),to:CodeMirror.Pos(0,1)});
    }catch(e){
      const parsed=Code.parseExpression(src),line=parsed.line||0,col=parsed.column||0;
      anns.push({message:parsed.message||String(e.message||'语法错误'),severity:'error',from:CodeMirror.Pos(line,col),to:CodeMirror.Pos(line,col+1)});
    }
    updateStatus(anns,false);
    return anns;
  }
  function updateStatus(anns,empty){
    const el=$("#srcStatus"),save=$("#save");if(!el)return;
    const errs=(anns||[]).filter(a=>a.severity==='error'),warns=(anns||[]).filter(a=>a.severity==='warning');
    if(empty){el.textContent='待输入';el.className='src-status warn';if(save)save.disabled=false;return}
    if(errs.length){el.textContent='语法错误：'+errs[0].message;el.className='src-status err';if(save)save.disabled=true}
    else if(warns.length){el.textContent=warns[0].message;el.className='src-status warn';if(save)save.disabled=false}
    else{el.textContent='语法有效';el.className='src-status ok';if(save)save.disabled=false}
  }
  function ensureEditor(){if(!editor&&window.CodeMirror)editor=CodeMirror.fromTextArea($("#source"),{mode:'javascript',lineNumbers:true,lineWrapping:true,matchBrackets:true,tabSize:2,viewportMargin:Infinity,gutters:['CodeMirror-lint-markers'],lint:{getAnnotations:lintSource}});return editor}
  function formatSource(){
    const cm=ensureEditor(),src=cm?cm.getValue():$("#source").value;
    let out;try{out=Code.formatExpression(src,{space_after_anon_function:true})}catch(e){return toast(e.message||'代码有语法错误，无法格式化')}
    if(cm){cm.setValue(out);requestAnimationFrame(()=>cm.performLint&&cm.performLint())}else{$("#source").value=out}
  }
  function preview(){const g=$("#group").value.trim(),n=$("#name").value.trim()||'函数名';$("#callPreview").textContent=(g?g+'.':'')+n+'(...)'}
  // 使用后端与运行时共用的方法元数据渲染 Java UDF 详情
  function openJavaDetail(u){
    const method=(u.methods||[])[0];
    $("#javaTitle").textContent=method?callablePath(u,method):fullName(u);$("#javaKind").textContent=implementationLabel(u);$("#javaImplementation").textContent=u.source||'—';
    const description=method&&method.description?`<div class="method-description">${esc(method.description)}</div>`:'';
    $("#javaMethods").innerHTML=method?`<div class="method-item"><div class="method-signature">${esc(callablePath(u,method))}(${methodParameters(method).map(esc).join(', ')}) → ${esc(method.returnType)}</div>${description}</div>`:'<div class="method-description">无已暴露方法</div>';$("#javaDialog").showModal()
  }
  function openJavascriptDetail(u){$("#jsTitle").textContent=javascriptSignature(u);$("#jsDescription").textContent=u.description||'—';$("#jsSource").textContent=u.source||'—';$("#jsDialog").showModal()}
  function open(u){editing=u||null;$("#dlgTitle").textContent=u?'编辑自定义函数':'新建自定义函数';$("#group").value=u?.group||'';$("#name").value=u?.name||'';$("#description").value=u?.description||'';const source=u?.source||'(target, context) => ({\n  result: target.value,\n  context\n})';$("#source").value=source;$("#dialog").showModal();const cm=ensureEditor();if(cm){cm.setValue(source);requestAnimationFrame(()=>{cm.refresh();cm.performLint&&cm.performLint()})}else{lintSource(source)}preview();requestAnimationFrame(()=>$("#group").focus())}
  async function save(){const body={namespace:Ns.code(),group:$("#group").value.trim(),name:$("#name").value.trim(),description:$("#description").value.trim(),source:(editor?editor.getValue():$("#source").value).trim()};if(!body.name||!body.source)return toast('请填写函数名称和函数实现');try{if(editing){body.version=editing.version;await Api.updateUdf(editing.id,body)}else await Api.createUdf(body);$("#dialog").close();toast('保存成功');load()}catch(e){toast('保存失败：'+e.message)}}
  $("#rows").addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v)return openJavaDetail(items[Number(v.dataset.view)]);const j=e.target.closest('[data-js-view]');if(j)return openJavascriptDetail(items[Number(j.dataset.jsView)]);const a=e.target.closest('[data-edit]');if(a)return open(items.find(x=>x.id===Number(a.dataset.edit)))});$("#search").addEventListener('input',Ui.debounce(e=>{keyword=e.target.value.trim();pager.reset();load()},250));$("#group").addEventListener('input',preview);$("#name").addEventListener('input',preview);$("#createBtn").addEventListener('click',()=>open(null));$("#cancel").addEventListener('click',()=>$("#dialog").close());$("#javaClose").addEventListener('click',()=>$("#javaDialog").close());$("#jsClose").addEventListener('click',()=>$("#jsDialog").close());$("#save").addEventListener('click',save);$("#format").addEventListener('click',formatSource);
  (async()=>{const ctx=await Ns.boot();if(!ctx)return;Ns.mountSelector($("#nsSlot"));Ns.applyTabs();load()})();
})();
</script>
</body>
</html>
