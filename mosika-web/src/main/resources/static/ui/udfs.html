<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自定义函数 · Mosika</title>
<link rel="icon" type="image/svg+xml" href="/ui/logo.svg">
<link rel="stylesheet" href="/ui/tokens.css?v=20260811-1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>

<style>
:root{color:#123038;background:#edf4f3;--teal:#0f9d8a;--teal-d:#0c8477;--soft:#dff5f1;--border:#cfe3e0;--muted:#6f8b86}*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}.shell{min-height:100vh;display:grid;grid-template-rows:58px 1fr}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 22px;border-bottom:1px solid var(--border);background:#fff}.brandwrap,.brand,.tabs,.tools,.actions,.pager{display:flex;align-items:center}.brand{gap:11px}.brand-home{color:inherit;text-decoration:none;border-radius:10px}.brand-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:#fff;font-weight:800;background:linear-gradient(145deg,#2fd6c6,#0f9d8a);box-shadow:0 5px 12px rgba(15,157,138,.32)}.brand-home .brand-mark{transition:transform .16s ease,box-shadow .16s ease}.brand-home:hover{color:var(--teal-d)}.brand-home:hover .brand-mark{transform:translateY(-1px);box-shadow:0 7px 16px rgba(15,157,138,.4)}.brand-home:focus-visible{outline:2px solid var(--teal);outline-offset:4px}.brand b{font-size:var(--fs-panel)}.tabs{gap:6px;margin-left:26px}.tab{height:32px;padding:0 14px;border-radius:8px;font-size:var(--fs-base);color:#5c766f;display:flex;align-items:center;text-decoration:none}.tab.on{background:var(--soft);color:var(--teal-d);font-weight:600}.tools{gap:10px}.search{display:flex;align-items:center;gap:7px;height:34px;width:240px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:var(--fs-panel)}.search input{flex:1;min-width:0;border:0;outline:none;font-size:var(--fs-base);background:transparent;color:#123038}.btn{height:34px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:#fff;color:#2c5049;font-size:var(--fs-base);cursor:pointer}.btn.primary{color:#fff;border-color:var(--teal);background:var(--teal);font-weight:600}.btn.link{border:0;background:none;color:var(--teal-d);padding:0 5px}.main{padding:22px 26px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.head h1{font-size:var(--fs-page)}.head p{font-size:var(--fs-base);color:var(--muted);margin-top:5px}.filters{display:flex;gap:8px}.chip{height:30px;padding:0 14px;border-radius:16px;border:1px solid var(--border);background:#fff;color:#54706a;font-size:var(--fs-meta);cursor:pointer}.chip.on{background:var(--soft);border-color:#9fd8cf;color:var(--teal-d);font-weight:600}.panel{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden}.scroll{overflow-x:auto}table{width:100%;min-width:950px;border-collapse:collapse;font-size:var(--fs-base)}th{text-align:left;padding:13px 18px;color:var(--muted);font-size:var(--fs-meta);background:#f4faf9;border-bottom:1px solid var(--border)}td{padding:14px 18px;border-bottom:1px solid #eef4f2;vertical-align:middle}.path{font-weight:600;font-size:var(--fs-base);font-family:var(--ff-mono);color:#086b60}.desc{color:#71887f;font-size:var(--fs-minor);margin-top:4px}.source{display:block;max-width:430px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--fs-minor);font-family:var(--ff-mono);color:#0b6274;background:#e3fafd;border-radius:6px;padding:5px 9px}.pill{font-size:var(--fs-label);font-weight:600;padding:3px 9px;border-radius:11px}.pill.on{color:#1f7a43;background:#dcf9e4}.pill.off{color:#7b8aa5;background:#eef1f6}.actions{gap:11px;justify-content:flex-end}.empty{padding:60px 20px;text-align:center;color:#8aa39d}.pager{min-height:52px;padding:10px 16px;justify-content:flex-end;gap:10px;color:#71887f;font-size:var(--fs-meta)}.pager button{height:30px;padding:0 12px;border:1px solid var(--border);border-radius:7px;background:#fff;cursor:pointer;font-size:var(--fs-meta)}.pager button:disabled{opacity:.45}.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#123038;color:#fff;padding:10px 18px;border-radius:10px;font-size:var(--fs-base);opacity:0;transition:.2s;pointer-events:none;z-index:20}.toast.show{opacity:.95}dialog{border:0;border-radius:16px;padding:0;margin:auto;width:min(880px,96vw);box-shadow:0 24px 70px rgba(18,48,56,.28)}dialog::backdrop{background:rgba(18,48,56,.32)}.dlg-head{padding:22px 24px 0}.dlg-title{font-size:var(--fs-title);font-weight:700}.dlg-sub{margin-top:6px;font-size:var(--fs-meta);color:var(--muted);line-height:1.55}.dlg-body{padding:18px 24px 4px;display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;align-items:stretch;max-height:80vh;overflow-y:auto}.dlg-body>.field.span-2{grid-column:1/-1}.dlg-body>.field{display:flex;flex-direction:column;height:100%}.dlg-body>.field>.hint{margin-top:auto;padding-top:6px}.field label{display:block;font-size:var(--fs-meta);color:#3f5c56;margin-bottom:7px;font-weight:600}.field .req{color:#e0654e;margin-left:2px}.field-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.field-bar label{margin-bottom:0}.field-tools{display:flex;align-items:center;gap:12px}.mini-btn{height:26px;padding:0 12px;border:1px solid var(--border);border-radius:7px;background:#fff;color:#2c5049;font-size:var(--fs-minor);cursor:pointer;transition:.15s}.mini-btn:hover{border-color:var(--teal);color:var(--teal-d);background:var(--soft)}.field input,.field textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:var(--fs-field);color:#123038;background:#fff;font-family:inherit}.field input:focus,.field textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--soft)}.hint{font-size:var(--fs-caption);color:#8aa39d;line-height:1.55;margin-top:6px}.call{font-family:var(--ff-mono);color:#0b6274}.CodeMirror{border:1px solid var(--border);border-radius:9px;height:auto;min-height:64px;font-size:var(--fs-base);font-family:var(--ff-mono)}.CodeMirror-scroll{max-height:320px}.CodeMirror-lint-markers{width:16px}.dlg-foot{padding:14px 24px 22px;display:flex;align-items:center;justify-content:flex-end;gap:10px}.foot-btns{display:flex;gap:10px}.src-status{font-size:var(--fs-minor);font-weight:600;display:flex;align-items:center;gap:6px}.src-status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.src-status.ok{color:#1f9d5c}.src-status.warn{color:#c68a11}.src-status.err{color:#d64545}.btn:disabled{opacity:.5;cursor:not-allowed}@media(max-width:800px){.topbar{height:auto;padding:12px 14px;flex-wrap:wrap}.brandwrap{width:100%;flex-wrap:wrap}.tabs{margin-left:0}.tools{width:100%}.search{flex:1;width:auto}.main{padding:16px 12px}.head{align-items:flex-start;flex-direction:column;gap:12px}.dlg-body{grid-template-columns:1fr}.dlg-body>.field.span-2{grid-column:1}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brandwrap"><a class="brand brand-home" href="/" aria-label="返回 Mosika 首页"><div class="brand-mark"><svg viewBox="0 0 48 48" width="22" height="22" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M24 15V21M14 21H34M14 21V27M34 21V27"/></g><g fill="#fff"><circle cx="24" cy="13" r="3.4"/><circle cx="14" cy="30" r="3.4"/><circle cx="34" cy="30" r="3.4"/></g></svg></div><b>Mosika</b></a><div id="nsSlot"></div><nav class="tabs"><a class="tab" href="/scenes">业务场景</a><a class="tab" href="/rules">业务规则</a><a class="tab on" href="/udfs">自定义函数</a></nav></div>
    <div class="tools"><div class="search">🔍 <input id="search" placeholder="搜索调用路径 / 描述 / 代码"></div><button class="btn primary" id="createBtn">＋ 新建函数</button></div>
  </header>
  <main class="main">
    <div class="head"><div><h1>自定义函数</h1><p id="summary">加载中…</p></div><div class="filters" id="filters"><button class="chip on" data-status="1">已启用</button><button class="chip" data-status="">全部</button><button class="chip" data-status="0">已停用</button></div></div>
    <section class="panel"><div class="scroll"><table><thead><tr><th style="width:26%">调用路径 / 描述</th><th style="width:45%">函数代码</th><th>版本</th><th style="text-align:right">状态 / 操作</th></tr></thead><tbody id="rows"><tr><td colspan="4"><div class="empty">加载中…</div></td></tr></tbody></table></div><div class="pager" id="pager" hidden><span id="pageText"></span><button id="prev">上一页</button><button id="next">下一页</button></div></section>
  </main>
</div>
<dialog id="dialog"><div class="dlg-head"><div class="dlg-title" id="dlgTitle">新建自定义函数</div></div><div class="dlg-body">
  <div class="field"><label>函数分组</label><input id="group" placeholder="例如 content.delivery"><div class="hint">使用英文句点分隔层级；<code>sys</code> 为系统保留分组。</div></div>
  <div class="field"><label>函数名称<span class="req">*</span></label><input id="name" placeholder="例如 publish"><div class="hint">调用路径：<span class="call" id="callPreview">publish(...)</span></div></div>
  <div class="field"><label>功能说明</label><input id="description" placeholder="例如：发布已通过门禁校验的内容"></div>
  <div class="field span-2"><div class="field-bar"><label>函数实现<span class="req">*</span></label><div class="field-tools"><span class="src-status ok" id="srcStatus">语法有效</span><button type="button" class="mini-btn" id="format">格式化</button></div></div><textarea id="source"></textarea><div class="hint">请输入 JavaScript 函数表达式，支持箭头函数、匿名函数和具名函数。</div></div>
</div><div class="dlg-foot"><button class="btn" id="cancel">取消</button><button class="btn primary" id="save">保存</button></div></dialog>
<div class="toast" id="toast"></div>
<script src="/ui/api.js?v=20260810-1"></script>
<script src="/ui/ns.js?v=20260810-1"></script>
<script>
(() => {
  "use strict";
  const Api=window.MosikaApi,Ns=window.MosikaNs,$=(s)=>document.querySelector(s),esc=(v)=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
  let status=1,keyword="",pageNumber=1,total=0,items=[],editing=null,editor=null,seq=0;const pageSize=20;
  const toast=(m)=>{const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)};
  const fullName=(u)=>u.group?`${u.group}.${u.name}`:u.name;
  async function load(){const current=++seq;$("#rows").innerHTML='<tr><td colspan="4"><div class="empty">加载中…</div></td></tr>';try{const p=await Api.listUdfs({status,keyword,pageNumber,pageSize,namespace:Ns.code()});if(current!==seq)return;items=p.items||[];total=p.total||0;if(!items.length&&total>0&&pageNumber>1){pageNumber--;return load()}render();}catch(e){$("#rows").innerHTML=`<tr><td colspan="4"><div class="empty">加载失败：${esc(e.message)}</div></td></tr>`}}
  function render(){$("#summary").textContent=`共 ${total} 个函数`;$("#rows").innerHTML=items.length?items.map(u=>`<tr style="${u.status===1?'':'opacity:.62'}"><td><div class="path">${esc(fullName(u))}(…)</div><div class="desc">${esc(u.description||'—')} · #${u.id}</div></td><td><span class="source" title="${esc(u.source)}">${esc(u.source)}</span></td><td>v${u.version}</td><td><div class="actions"><span class="pill ${u.status===1?'on':'off'}">${u.status===1?'已启用':'已停用'}</span><button class="btn link" data-edit="${u.id}">编辑</button><button class="btn link" data-toggle="${u.id}">${u.status===1?'停用':'启用'}</button></div></td></tr>`).join(''):'<tr><td colspan="4"><div class="empty">暂无自定义函数</div></td></tr>';const pages=Math.max(1,Math.ceil(total/pageSize));$("#pager").hidden=total<=pageSize;$("#pageText").textContent=`第 ${pageNumber} / ${pages} 页`;$("#prev").disabled=pageNumber<=1;$("#next").disabled=pageNumber>=pages}
  function lintSource(text){
    const anns=[],src=String(text||'').trim();
    if(!src){updateStatus(anns,true);return anns}
    try{
      const ast=acorn.parse('(\n'+src+'\n)',{ecmaVersion:2020});
      const expr=ast.body[0]&&ast.body[0].expression,t=expr&&expr.type;
      const funcish=['FunctionExpression','ArrowFunctionExpression','CallExpression','ConditionalExpression','LogicalExpression','MemberExpression'];
      if(t&&funcish.indexOf(t)<0)anns.push({message:'函数实现必须为可调用的 JavaScript 表达式。',severity:'warning',from:CodeMirror.Pos(0,0),to:CodeMirror.Pos(0,1)});
    }catch(e){
      const loc=e.loc||{line:2,column:0},line=Math.max(0,loc.line-2),col=Math.max(0,loc.column|0);
      anns.push({message:String(e.message||'语法错误').replace(/\s*\(\d+:\d+\)\s*$/,''),severity:'error',from:CodeMirror.Pos(line,col),to:CodeMirror.Pos(line,col+1)});
    }
    updateStatus(anns,false);
    return anns;
  }
  function updateStatus(anns,empty){
    const el=$("#srcStatus"),save=$("#save");if(!el)return;
    const errs=(anns||[]).filter(a=>a.severity==='error'),warns=(anns||[]).filter(a=>a.severity==='warning');
    if(empty){el.textContent='待输入';el.className='src-status warn';if(save)save.disabled=false;return}
    if(errs.length){el.textContent='语法错误：'+errs[0].message;el.className='src-status err';if(save)save.disabled=true}
    else if(warns.length){el.textContent=warns[0].message;el.className='src-status warn';if(save)save.disabled=false}
    else{el.textContent='语法有效';el.className='src-status ok';if(save)save.disabled=false}
  }
  function ensureEditor(){if(!editor&&window.CodeMirror)editor=CodeMirror.fromTextArea($("#source"),{mode:'javascript',lineNumbers:true,lineWrapping:true,matchBrackets:true,tabSize:2,viewportMargin:Infinity,gutters:['CodeMirror-lint-markers'],lint:{getAnnotations:lintSource}});return editor}
  function formatSource(){
    const cm=ensureEditor(),src=cm?cm.getValue():$("#source").value;
    if(!window.js_beautify)return toast('格式化组件未加载');
    try{acorn.parse('(\n'+String(src||'').trim()+'\n)',{ecmaVersion:2020})}catch(e){return toast('代码有语法错误，无法格式化')}
    const out=window.js_beautify(src,{indent_size:2,brace_style:'collapse',space_after_anon_function:true,end_with_newline:false});
    if(cm){cm.setValue(out);requestAnimationFrame(()=>cm.performLint&&cm.performLint())}else{$("#source").value=out}
  }
  function preview(){const g=$("#group").value.trim(),n=$("#name").value.trim()||'函数名';$("#callPreview").textContent=(g?g+'.':'')+n+'(...)'}
  function open(u){editing=u||null;$("#dlgTitle").textContent=u?'编辑自定义函数':'新建自定义函数';$("#group").value=u?.group||'';$("#name").value=u?.name||'';$("#description").value=u?.description||'';const source=u?.source||'(target, context) => ({\n  result: target.value,\n  context\n})';$("#source").value=source;$("#dialog").showModal();const cm=ensureEditor();if(cm){cm.setValue(source);requestAnimationFrame(()=>{cm.refresh();cm.performLint&&cm.performLint()})}else{lintSource(source)}preview();requestAnimationFrame(()=>$("#group").focus())}
  async function save(){const body={namespace:Ns.code(),group:$("#group").value.trim(),name:$("#name").value.trim(),description:$("#description").value.trim(),source:(editor?editor.getValue():$("#source").value).trim()};if(!body.name||!body.source)return toast('请填写函数名称和函数实现');try{if(editing){body.version=editing.version;await Api.updateUdf(editing.id,body)}else await Api.createUdf(body);$("#dialog").close();toast('保存成功');load()}catch(e){toast('保存失败：'+e.message)}}
  async function toggle(id){const u=items.find(x=>x.id===id);if(!u)return;if(u.status===1&&!confirm(`停用 ${fullName(u)} 后，规则中的同名调用将不再可用。继续？`))return;try{u.status===1?await Api.disableUdf(id,u.version):await Api.enableUdf(id,u.version);toast(u.status===1?'已停用':'已启用');load()}catch(e){toast('操作失败：'+e.message)}}
  $("#rows").addEventListener('click',e=>{const a=e.target.closest('[data-edit]');if(a)return open(items.find(x=>x.id===Number(a.dataset.edit)));const t=e.target.closest('[data-toggle]');if(t)toggle(Number(t.dataset.toggle))});$("#filters").addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');status=c.dataset.status===''?null:Number(c.dataset.status);pageNumber=1;load()});let timer;$("#search").addEventListener('input',e=>{keyword=e.target.value.trim();pageNumber=1;clearTimeout(timer);timer=setTimeout(load,250)});$("#group").addEventListener('input',preview);$("#name").addEventListener('input',preview);$("#createBtn").addEventListener('click',()=>open(null));$("#cancel").addEventListener('click',()=>$("#dialog").close());$("#save").addEventListener('click',save);$("#format").addEventListener('click',formatSource);$("#prev").addEventListener('click',()=>{if(pageNumber>1){pageNumber--;load()}});$("#next").addEventListener('click',()=>{if(pageNumber*pageSize<total){pageNumber++;load()}});
  (async()=>{const ctx=await Ns.boot();if(!ctx)return;Ns.mountSelector($("#nsSlot"));Ns.applyTabs();load()})();
})();
</script>
</body>
</html>
