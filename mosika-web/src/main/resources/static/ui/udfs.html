<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UDF 注册中心 · Mosika</title>
<link rel="icon" type="image/svg+xml" href="/ui/logo.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;color:#123038;background:#edf4f3;--teal:#0f9d8a;--teal-d:#0c8477;--soft:#dff5f1;--border:#cfe3e0;--muted:#6f8b86}*{box-sizing:border-box;margin:0;padding:0}button,input,textarea{font:inherit}.shell{min-height:100vh;display:grid;grid-template-rows:58px 1fr}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 22px;border-bottom:1px solid var(--border);background:#fff}.brandwrap,.brand,.tabs,.tools,.actions,.pager{display:flex;align-items:center}.brand{gap:11px}.brand-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:#fff;font-weight:800;background:linear-gradient(145deg,#2fd6c6,#0f9d8a)}.brand b{font-size:15px}.tabs{gap:6px;margin-left:26px}.tab{height:32px;padding:0 14px;border-radius:8px;font-size:13px;color:#5c766f;display:flex;align-items:center;text-decoration:none}.tab.on{background:var(--soft);color:var(--teal-d);font-weight:600}.tools{gap:10px}.search{height:34px;width:240px;padding:0 12px;border:1px solid var(--border);border-radius:8px;outline:none}.btn{height:34px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:#fff;color:#2c5049;cursor:pointer}.btn.primary{color:#fff;border-color:var(--teal);background:var(--teal);font-weight:600}.btn.link{border:0;background:none;color:var(--teal-d);padding:0 5px}.main{padding:22px 26px;overflow:auto}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.head h1{font-size:19px}.head p{font-size:13px;color:var(--muted);margin-top:5px}.filters{display:flex;gap:8px}.chip{height:30px;padding:0 14px;border-radius:16px;border:1px solid var(--border);background:#fff;color:#54706a;font-size:12.5px;cursor:pointer}.chip.on{background:var(--soft);border-color:#9fd8cf;color:var(--teal-d);font-weight:600}.panel{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden}.scroll{overflow-x:auto}table{width:100%;min-width:950px;border-collapse:collapse;font-size:13px}th{text-align:left;padding:13px 18px;color:var(--muted);font-size:12.5px;background:#f4faf9;border-bottom:1px solid var(--border)}td{padding:14px 18px;border-bottom:1px solid #eef4f2;vertical-align:middle}.path{font:600 13px "JetBrains Mono",Menlo,monospace;color:#086b60}.desc{color:#71887f;font-size:12px;margin-top:4px}.source{display:block;max-width:430px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:12px "JetBrains Mono",Menlo,monospace;color:#0b6274;background:#e3fafd;border-radius:6px;padding:5px 9px}.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:11px}.pill.on{color:#1f7a43;background:#dcf9e4}.pill.off{color:#7b8aa5;background:#eef1f6}.actions{gap:11px;justify-content:flex-end}.empty{padding:60px 20px;text-align:center;color:#8aa39d}.pager{min-height:52px;padding:10px 16px;justify-content:flex-end;gap:10px;color:#71887f;font-size:12px}.pager button{height:30px;padding:0 12px;border:1px solid var(--border);border-radius:7px;background:#fff;cursor:pointer}.pager button:disabled{opacity:.45}.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#123038;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:20}.toast.show{opacity:.95}dialog{border:0;border-radius:14px;padding:0;margin:auto;width:min(650px,94vw);box-shadow:0 20px 60px rgba(18,48,56,.28)}dialog::backdrop{background:rgba(18,48,56,.3)}.dlg-head{padding:18px 22px 6px;font-size:16px;font-weight:700}.dlg-body{padding:12px 22px;display:grid;gap:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12.5px;color:#5c766f;margin-bottom:7px;font-weight:600}.field input,.field textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:#123038}.field input:focus,.field textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--soft)}.hint{font-size:11.5px;color:#8aa39d;line-height:1.55;margin-top:6px}.call{font-family:Menlo,monospace;color:#0b6274}.CodeMirror{border:1px solid var(--border);border-radius:9px;height:190px;font:13px "JetBrains Mono",Menlo,monospace}.dlg-foot{padding:14px 22px 20px;display:flex;justify-content:flex-end;gap:10px}@media(max-width:800px){.topbar{height:auto;padding:12px 14px;flex-wrap:wrap}.brandwrap{width:100%;flex-wrap:wrap}.tabs{margin-left:0}.tools{width:100%}.search{flex:1}.main{padding:16px 12px}.head{align-items:flex-start;flex-direction:column;gap:12px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brandwrap"><div class="brand"><div class="brand-mark">M</div><b>Mosika 规则编排</b></div><nav class="tabs"><a class="tab" href="/">业务场景</a><a class="tab" href="/rules">业务规则</a><a class="tab on" href="/udfs">UDF</a></nav></div>
    <div class="tools"><input class="search" id="search" placeholder="搜索路径 / 描述 / 源码"><button class="btn primary" id="createBtn">＋ 注册 UDF</button></div>
  </header>
  <main class="main">
    <div class="head"><div><h1>JavaScript UDF 注册中心</h1><p id="summary">把稳定函数注册为规则表达式可直接调用的扩展能力</p><p>函数在服务进程内执行，本参考页面仅面向受信任的管理者；对外部署必须补充鉴权、授权和审计。</p></div><div class="filters" id="filters"><button class="chip on" data-status="1">已启用</button><button class="chip" data-status="">全部</button><button class="chip" data-status="0">已停用</button></div></div>
    <section class="panel"><div class="scroll"><table><thead><tr><th style="width:26%">调用路径 / 描述</th><th style="width:45%">JavaScript 函数</th><th>版本</th><th style="text-align:right">状态 / 操作</th></tr></thead><tbody id="rows"><tr><td colspan="4"><div class="empty">加载中…</div></td></tr></tbody></table></div><div class="pager" id="pager" hidden><span id="pageText"></span><button id="prev">上一页</button><button id="next">下一页</button></div></section>
  </main>
</div>
<dialog id="dialog"><div class="dlg-head" id="dlgTitle">注册 UDF</div><div class="dlg-body">
  <div class="row"><div class="field"><label>分组</label><input id="group" placeholder="如 content.generation"><div class="hint">支持点分隔的命名空间；<code>sys</code> 为内置保留分组。</div></div><div class="field"><label>函数名 *</label><input id="name" placeholder="如 bindCitations"><div class="hint">保存后的调用路径：<span class="call" id="callPreview">bindCitations(...)</span></div></div></div>
  <div class="field"><label>描述</label><input id="description" placeholder="说明稳定业务语义、参数和返回值"></div>
  <div class="field"><label>JavaScript 函数 *</label><textarea id="source"></textarea><div class="hint">源码的求值结果必须是函数。支持带参数的箭头函数、匿名 <code>function</code> 或与注册名一致的命名函数；保存时立即编译校验。</div></div>
</div><div class="dlg-foot"><button class="btn" id="cancel">取消</button><button class="btn primary" id="save">编译并注册</button></div></dialog>
<div class="toast" id="toast"></div>
<script src="/ui/api.js?v=20260805-1"></script>
<script>
(() => {
  "use strict";
  const Api=window.MosikaApi,$=(s)=>document.querySelector(s),esc=(v)=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
  let status=1,keyword="",pageNumber=1,total=0,items=[],editing=null,editor=null,seq=0;const pageSize=20;
  const toast=(m)=>{const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)};
  const fullName=(u)=>u.group?`${u.group}.${u.name}`:u.name;
  async function load(){const current=++seq;$("#rows").innerHTML='<tr><td colspan="4"><div class="empty">加载中…</div></td></tr>';try{const p=await Api.listUdfs({status,keyword,pageNumber,pageSize});if(current!==seq)return;items=p.items||[];total=p.total||0;if(!items.length&&total>0&&pageNumber>1){pageNumber--;return load()}render();}catch(e){$("#rows").innerHTML=`<tr><td colspan="4"><div class="empty">加载失败：${esc(e.message)}</div></td></tr>`}}
  function render(){$("#summary").textContent=`当前筛选共 ${total} 个 UDF · 保存后热刷新运行态`;$("#rows").innerHTML=items.length?items.map(u=>`<tr style="${u.status===1?'':'opacity:.62'}"><td><div class="path">${esc(fullName(u))}(…)</div><div class="desc">${esc(u.description||'—')} · #${u.id}</div></td><td><span class="source" title="${esc(u.source)}">${esc(u.source)}</span></td><td>v${u.version}</td><td><div class="actions"><span class="pill ${u.status===1?'on':'off'}">${u.status===1?'已启用':'已停用'}</span><button class="btn link" data-edit="${u.id}">编辑</button><button class="btn link" data-toggle="${u.id}">${u.status===1?'停用':'启用'}</button></div></td></tr>`).join(''):'<tr><td colspan="4"><div class="empty">暂无 UDF，点右上角「注册 UDF」添加。</div></td></tr>';const pages=Math.max(1,Math.ceil(total/pageSize));$("#pager").hidden=total<=pageSize;$("#pageText").textContent=`第 ${pageNumber} / ${pages} 页`;$("#prev").disabled=pageNumber<=1;$("#next").disabled=pageNumber>=pages}
  function ensureEditor(){if(!editor&&window.CodeMirror)editor=CodeMirror.fromTextArea($("#source"),{mode:'javascript',lineNumbers:true,lineWrapping:true,matchBrackets:true,tabSize:2});return editor}
  function preview(){const g=$("#group").value.trim(),n=$("#name").value.trim()||'函数名';$("#callPreview").textContent=(g?g+'.':'')+n+'(...)'}
  function open(u){editing=u||null;$("#dlgTitle").textContent=u?'编辑 UDF':'注册 UDF';$("#group").value=u?.group||'';$("#name").value=u?.name||'';$("#description").value=u?.description||'';const source=u?.source||'(target, context) => ({\n  result: target.value,\n  context\n})';$("#source").value=source;$("#dialog").showModal();const cm=ensureEditor();if(cm){cm.setValue(source);requestAnimationFrame(()=>cm.refresh())}preview();requestAnimationFrame(()=>$("#group").focus())}
  async function save(){const body={group:$("#group").value.trim(),name:$("#name").value.trim(),description:$("#description").value.trim(),source:(editor?editor.getValue():$("#source").value).trim()};if(!body.name||!body.source)return toast('函数名和源码不能为空');try{if(editing){body.version=editing.version;await Api.updateUdf(editing.id,body)}else await Api.createUdf(body);$("#dialog").close();toast('编译通过，运行态已刷新');load()}catch(e){toast('保存失败：'+e.message)}}
  async function toggle(id){const u=items.find(x=>x.id===id);if(!u)return;if(u.status===1&&!confirm(`停用 ${fullName(u)} 后，规则中的同名调用将不再可用。继续？`))return;try{u.status===1?await Api.disableUdf(id,u.version):await Api.enableUdf(id,u.version);toast(u.status===1?'已停用':'已启用');load()}catch(e){toast('操作失败：'+e.message)}}
  $("#rows").addEventListener('click',e=>{const a=e.target.closest('[data-edit]');if(a)return open(items.find(x=>x.id===Number(a.dataset.edit)));const t=e.target.closest('[data-toggle]');if(t)toggle(Number(t.dataset.toggle))});$("#filters").addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');status=c.dataset.status===''?null:Number(c.dataset.status);pageNumber=1;load()});let timer;$("#search").addEventListener('input',e=>{keyword=e.target.value.trim();pageNumber=1;clearTimeout(timer);timer=setTimeout(load,250)});$("#group").addEventListener('input',preview);$("#name").addEventListener('input',preview);$("#createBtn").addEventListener('click',()=>open(null));$("#cancel").addEventListener('click',()=>$("#dialog").close());$("#save").addEventListener('click',save);$("#prev").addEventListener('click',()=>{if(pageNumber>1){pageNumber--;load()}});$("#next").addEventListener('click',()=>{if(pageNumber*pageSize<total){pageNumber++;load()}});load();
})();
</script>
</body>
</html>
