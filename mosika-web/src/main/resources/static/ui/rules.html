<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>业务规则 · Mosika</title>
    <link rel="icon" type="image/svg+xml" href="/ui/logo.svg">
    <link rel="stylesheet" href="/ui/tokens.css?v=20260811-1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.11/beautify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/acorn/8.11.3/acorn.min.js"></script>
<style>
:root{
  color:#123038;background:#edf4f3;
  --teal:#0f9d8a;--teal-d:#0c8477;--teal-soft:#dff5f1;
  --cyan:#0891b2;--cyan-soft:#e3fafd;
  --green:#1f7a43;--green-soft:#dcf9e4;
  --lemon:#8a6d0e;--lemon-soft:#fdf6d5;
  --grey:#7b8aa5;--grey-soft:#eef1f6;--border:#cfe3e0;
}
*{box-sizing:border-box;margin:0;padding:0}
/* hidden 属性兜底：带 display 的类（.pager/.targs 等）会盖掉 UA 的 [hidden]{display:none} */
[hidden]{display:none!important}
.app-shell{height:100vh;display:grid;grid-template-rows:58px minmax(0,1fr)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 22px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.96);box-shadow:0 2px 12px rgba(20,80,72,.05);}
.brandwrap{display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:11px}
.brand-home{color:inherit;text-decoration:none;border-radius:10px}
.brand-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:#fff;font-weight:800;background:linear-gradient(145deg,#2fd6c6,#0f9d8a);box-shadow:0 5px 12px rgba(15,157,138,.32)}
.brand-home .brand-mark{transition:transform .16s ease,box-shadow .16s ease}.brand-home:hover{color:var(--teal-d)}.brand-home:hover .brand-mark{transform:translateY(-1px);box-shadow:0 7px 16px rgba(15,157,138,.4)}.brand-home:focus-visible{outline:2px solid var(--teal);outline-offset:4px}
.brand b{font-size:var(--fs-panel)}.brand small{display:block;color:#6f8b86;font-size:var(--fs-caption);margin-top:1px}
.tabs{display:flex;gap:6px;margin-left:26px}
.tab{height:32px;padding:0 14px;border-radius:8px;font-size:var(--fs-base);color:#5c766f;display:flex;align-items:center;cursor:pointer;text-decoration:none}
.tab.on{background:var(--teal-soft);color:var(--teal-d);font-weight:600}
.top-right{display:flex;align-items:center;gap:12px}
.search{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:var(--fs-panel)}/* 该字号只作用于框内 🔍 字形，输入框自带 --fs-base */
.search input{border:none;outline:none;font-size:var(--fs-base);width:200px;background:transparent;color:#123038}
.btn{height:34px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:#fff;color:#2c5049;font-size:var(--fs-base);cursor:pointer}
.btn:hover{border-color:#a9d3cc;background:#f5faf9}
.btn.primary{color:#fff;border-color:var(--teal);background:var(--teal);font-weight:600}
.btn.primary:hover{background:var(--teal-d)}
.btn.link{border:none;background:none;color:var(--teal-d);padding:0 6px;cursor:pointer}
.btn.link.danger{color:#c9504f}
.main{overflow:auto;padding:22px 26px}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-head>div:first-child{display:flex;align-items:baseline}
.page-head h1{font-size:var(--fs-page)}
.page-head .sub{color:#6f8b86;font-size:var(--fs-base);margin-left:10px;font-weight:400}
.filters{display:flex;gap:8px}
.chip{height:30px;padding:0 14px;border-radius:16px;border:1px solid var(--border);background:#fff;color:#54706a;font-size:var(--fs-meta);display:flex;align-items:center;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--teal-soft);border-color:#9fd8cf;color:var(--teal-d);font-weight:600}
.panel{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(20,80,72,.05)}
.table-scroll{overflow-x:auto}table{width:100%;min-width:900px;border-collapse:collapse;font-size:var(--fs-base)}
thead th{text-align:left;padding:13px 18px;color:#6f8b86;font-weight:600;font-size:var(--fs-meta);background:#f4faf9;border-bottom:1px solid var(--border)}
tbody td{padding:14px 18px;border-bottom:1px solid #eef4f2;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f7fcfb}
.name{font-weight:600;font-size:var(--fs-strong)}
.name .id{color:#9fb4af;font-weight:400;font-size:var(--fs-caption);margin-left:7px}
.rowdesc{color:#71887f;font-size:var(--fs-minor);margin-top:3px;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.expr{font-family:var(--ff-mono);font-size:var(--fs-minor);color:#0b6274;background:var(--cyan-soft);border:1px solid #c6ecf3;border-radius:6px;padding:4px 9px;display:inline-block;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.tag{font-size:var(--fs-label);font-weight:600;padding:3px 9px;border-radius:11px}
.tag.atom{color:var(--green);background:var(--green-soft)}
.tag.table{color:var(--lemon);background:var(--lemon-soft)}
.tag.cond{color:var(--green);background:var(--green-soft)}
.tag.action{color:var(--cyan);background:var(--cyan-soft)}
.pill{font-size:var(--fs-label);font-weight:600;padding:3px 9px;border-radius:11px}
.pill.on{color:var(--green);background:var(--green-soft)}.pill.off{color:var(--grey);background:var(--grey-soft)}
.refbadge{display:inline-flex;align-items:center;gap:5px;color:#3f5f58}
.refbadge .dot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.refbadge.zero{color:#a7c0ba}.refbadge.zero .dot{background:#cdddd8}
.actions{display:flex;gap:14px;align-items:center;justify-content:flex-end}
.status-toggle{height:28px;padding:0;border:0;background:transparent;display:inline-flex;align-items:center;gap:7px;color:#8aa39d;cursor:pointer;text-align:left}
.status-toggle-track{width:34px;height:19px;border-radius:10px;background:#cbd8d5;position:relative;transition:background .18s ease,box-shadow .18s ease}
.status-toggle-thumb{position:absolute;top:3px;left:3px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(18,48,56,.28);transition:transform .18s ease}
.status-toggle.is-on{color:var(--teal-d);font-weight:600}.status-toggle.is-on .status-toggle-track{background:var(--teal)}.status-toggle.is-on .status-toggle-thumb{transform:translateX(15px)}
.status-toggle:hover .status-toggle-track{box-shadow:0 0 0 3px rgba(15,157,138,.12)}
.status-toggle:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:7px}
.status-toggle-label{font-size:var(--fs-meta);line-height:1;min-width:42px}
.empty,.loading{padding:60px 20px;text-align:center;color:#8aa39d;font-size:var(--fs-field)}
.pager{min-height:52px;padding:10px 16px;border-top:1px solid #eef4f2;display:flex;align-items:center;justify-content:flex-end;gap:10px;color:#71887f;font-size:var(--fs-meta)}.pager button{height:30px;padding:0 12px;border:1px solid var(--border);border-radius:7px;background:#fff;color:#355d55;cursor:pointer;font-size:var(--fs-meta)}.pager button:disabled{opacity:.45;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#123038;color:#fff;padding:10px 18px;border-radius:10px;font-size:var(--fs-base);opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:.95}
dialog{border:none;border-radius:14px;padding:0;margin:auto;box-shadow:0 20px 60px rgba(18,48,56,.28);width:min(1280px,96vw)}
dialog::backdrop{background:rgba(18,48,56,.3)}
.dlg-head{padding:18px 24px 6px;font-size:var(--fs-title);font-weight:700}
.dlg-body{padding:12px 24px;display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;align-items:stretch;max-height:80vh;overflow-y:auto}
.dlg-body>.field.span-2{grid-column:1/-1}
/* ── 编辑规则弹窗（方案 A）：信息行通栏 + 左主区（固定高编辑器 + 可滚动参数表）+ 右列常驻试运行 ──
   高度上限落在 .rule-work 这个 flex 容器上：加在 grid 容器上只会裁切，不会触发子项收缩 */
/* 标题与底部按钮固定，中间内容区自己滚。弹窗顶部锚定（不做垂直居中），
   这样切换页签导致高度变化时只向下伸展，标题位置恒定不跳 */
#ruleDlg{width:min(940px,96vw);max-height:92vh;margin:4vh auto auto;display:flex;flex-direction:column}
#ruleDlg .dlg-head,#ruleDlg .dlg-foot{flex:none}
#ruleDlg .dlg-body{flex:1 1 auto;min-height:0}
#ruleDlg .dlg-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 24px 0;scroll-padding-block-end:12px;scroll-behavior:smooth}
#ruleDlg .dpane{min-height:min(452px,42vh)}
#ruleDlg .dlg-body{display:flex;flex-direction:column;gap:0;height:auto;max-height:none;overflow:hidden;padding-left:0;padding-right:0}
/* 名称/描述/类型与页签常驻不滚，只有页内容滚，避免滚动时顶部剩半截输入框 */
#ruleDlg .dlg-fixed{flex:none;display:flex;flex-direction:column;gap:12px;padding:0 24px}
#ruleDlg .rule-info{display:grid;grid-template-columns:1fr 1.5fr;gap:10px 14px;align-items:start}
/* 弹窗分页：表达式与参数 / 试运行 */
.dlg-tabs{display:flex;gap:4px;border-bottom:1px solid #eef4f2}
.dtab{padding:8px 14px;border:0;background:none;color:#6f8b86;font-size:var(--fs-base);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.dtab:hover{color:var(--teal-d)}
.dtab.on{color:var(--teal-d);font-weight:600;border-bottom-color:var(--teal)}
/* 试运行页：左侧三页输入，右侧结果，避免纵向堆叠 */
#ruleDlg .test-pane{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
#ruleDlg .test-inputs,#ruleDlg .test-output{min-width:0;display:flex;flex-direction:column}
#ruleDlg .test-inputs .mono-area{min-height:210px}
#ruleDlg .test-output .test-result{min-height:210px}
/* 类型独占一行，标签与单选框横向排在同一行，避免上下两行的空白 */
#ruleDlg .rule-info>.field-kind{grid-column:1/-1;display:flex;align-items:center;gap:12px}
#ruleDlg .rule-info>.field-kind>label{margin-bottom:0;flex:none}
#ruleDlg .rule-info>.field-kind .radiobar{height:auto}
#ruleDlg .rule-info>.field{height:auto}
#ruleDlg .rule-info>.field>.hint{margin-top:6px;padding-top:0}
#ruleDlg .rule-work{min-width:0;display:flex;flex-direction:column;gap:14px}
#ruleDlg .rule-work>.field{height:auto;flex:none;min-width:0}
/* 参数区按内容自然展开，不再套第二层滚动条：整个弹窗体只保留一个滚动容器，
   否则矮屏下参数区会被压到不足一行高，看起来像「显示不全」 */
#ruleDlg .rule-work>.field-params{display:flex;flex-direction:column;gap:6px}
#ruleDlg .field-params .params-editor{display:flex;flex-direction:column;gap:6px}
/* 新加的参数行短暂高亮，让「手动添加」有明确反馈 */
@keyframes paramFlash{from{background:#e3fafd;border-color:var(--cyan)}to{background:#fff;border-color:var(--border)}}
.param-card.flash{animation:paramFlash .9s ease-out}

/* 行内圆点单选：条件 / 动作 */
.radiobar{display:flex;align-items:center;gap:8px;height:43px}
.radiobar .rd{position:relative;display:inline-flex;align-items:center;gap:6px;height:31px;padding:0 11px 0 9px;border:1px solid var(--border);border-radius:16px;background:#fff;color:#5c766f;font-size:var(--fs-base);cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
.radiobar .rd:hover{border-color:#a9d3cc;background:#f8fcfb}
.radiobar .rd input{position:absolute;opacity:0;width:0;height:0;margin:0}
.radiobar .rd .dot{width:14px;height:14px;border-radius:50%;border:1.5px solid #b9cfca;background:#fff;position:relative;flex:none}
.radiobar .rd:has(input:checked){border-color:#9fd8cf;background:var(--teal-soft);color:var(--teal-d);font-weight:600}
.radiobar .rd:has(input:checked) .dot{border-color:var(--teal)}
.radiobar .rd:has(input:checked) .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--teal)}
.radiobar .rd:has(input:focus-visible){outline:2px solid var(--teal);outline-offset:2px}

/* 字段头：标签 + 右侧工具 */
.field-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
.field-bar label{margin-bottom:0}
.field-tools{display:flex;align-items:center;gap:8px}
.tag-lang{font-size:var(--fs-note);font-weight:700;letter-spacing:.04em;color:#5a6b86;background:var(--grey-soft);border-radius:4px;padding:3px 6px}
.lint-state{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-minor);font-weight:600}
.lint-state::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.lint-state.ok{color:#1f9d5c}
.lint-state.bad{color:#d64545}
.mini-btn{height:26px;padding:0 11px;border:1px solid var(--border);border-radius:7px;background:#fff;color:#2c5049;font-size:var(--fs-minor);cursor:pointer}
.mini-btn:hover{border-color:var(--teal);color:var(--teal-d);background:var(--teal-soft)}
.mini-btn.dashed{border-style:dashed;border-color:#9fd8cf;color:var(--teal-d);background:#f4faf9}

/* 代码编辑器外壳：文件条 + 固定高正文 + 行列状态栏 */
.editor-shell{border:1px solid #c2d4d1;border-radius:10px;overflow:hidden;background:#fbfefe}
.editor-shell:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.editor-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;height:30px;padding:0 8px 0 10px;background:#f2f7f6;border-bottom:1px solid #e0ebe9}
.editor-file{font-size:var(--fs-note);color:#7b8f8b;font-family:var(--ff-mono)}
.editor-acts{display:flex;align-items:center;gap:6px}
.chip-btn{height:20px;padding:0 7px;border:1px solid #d6e5e2;border-radius:5px;background:#fff;color:#4d6b64;font-size:var(--fs-note);cursor:pointer;line-height:1}
.chip-btn:hover{border-color:var(--teal);color:var(--teal-d);background:var(--teal-soft)}
.editor-status{display:flex;align-items:center;justify-content:space-between;height:26px;padding:0 10px;background:#f2f7f6;border-top:1px solid #e0ebe9;font-size:var(--fs-note);font-family:var(--ff-mono);color:#8aa39d}
/* 编辑器仍是固定尺寸（不随内容伸缩），但按视口分档，矮屏下不至于把参数区挤出可视区 */
#ruleDlg .field-expr .CodeMirror{border:0;border-radius:0;height:clamp(104px,19vh,196px);min-height:0;background:#fbfefe;padding:4px 2px}
#ruleDlg .field-expr .CodeMirror-scroll{max-height:none;height:100%}
#ruleDlg .field-expr .CodeMirror-activeline-background{background:#eef7f5}

/* 参数表：参数名只读 chip，说明与枚举项落到第二行 */
.field-sub{margin-left:8px;font-size:var(--fs-caption);font-weight:400;color:#93a89f}
#ruleDlg .param-head{display:grid;grid-template-columns:142px 1fr 80px 92px 1fr 22px;gap:6px;padding:0 8px 4px;font-size:var(--fs-caption);color:#8aa39d;font-weight:600}
#ruleDlg .param-card{grid-template-columns:142px 1fr 80px 92px 1fr 22px}
/* 归零旧六列布局遗留的 order，否则 grid 按 order 而非 DOM 顺序排布，默认值会被挤到第三行 */
#ruleDlg .param-card>*{order:0}
#ruleDlg .param-card .param-name-fixed{display:inline-flex;align-items:center;height:27px;padding:0 8px;font-family:var(--ff-mono);font-size:var(--fs-minor);font-weight:600;color:#0b6274;background:var(--cyan-soft);border:1px solid #c6ecf3;border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ruleDlg .param-card [data-p=name]{grid-column:1}
#ruleDlg .param-card [data-p=label]{grid-column:2}
#ruleDlg .param-card .param-type{grid-column:3}
#ruleDlg .param-card [data-p=default]{grid-column:4}
#ruleDlg .param-card [data-p=description]{grid-column:5}
#ruleDlg .param-card .param-remove{grid-column:6;justify-self:center}
#ruleDlg .param-card [data-p=options]{grid-column:1/-1}
.param-card.stale{background:#fcfaf5;border-color:#f0e2b0}
.param-card.stale .param-name-fixed{color:#8a6d0e;background:#fdf6d5;border-color:#f0e2b0;text-decoration:line-through}
.param-stale-note{grid-column:2/6;font-size:var(--fs-caption);color:#a67823;line-height:1.4}
.param-keep{grid-column:2/6;justify-self:start;height:22px;padding:0 8px;border:1px solid #e2cf8f;border-radius:6px;background:#fff;color:#8a6d0e;font-size:var(--fs-note);cursor:pointer}

.mono-area{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-family:var(--ff-mono);font-size:var(--fs-minor);line-height:1.6;color:#123038;background:#fff;resize:vertical;min-height:66px}
.mono-area:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.mono-area.invalid{border-color:#d64545}
.mono-area.invalid:focus{border-color:#d64545;box-shadow:0 0 0 3px #fbe3e3}
.json-err{margin-top:5px;font-size:var(--fs-caption);color:#c0392b;line-height:1.5}
.targs{display:flex;flex-direction:column;gap:8px}
.targs .targ{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:center}
.targs .targ-name{font-family:var(--ff-mono);font-size:var(--fs-minor);font-weight:600;color:#0b6274;overflow:hidden;text-overflow:ellipsis}
.targs .targ-name small{display:block;margin-top:3px;font-family:var(--ff-sans);font-size:var(--fs-note);font-weight:400;color:#93a89f}
.targs input,.targs select{width:100%;border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:var(--fs-meta);color:#123038;background:#fff}
.targs-empty{font-size:var(--fs-minor);color:#8aa39d}
/* 入参 / 上下文 分页填写，避免下面再另起一块 */
.test-tabs{display:flex;gap:4px;margin-bottom:8px;border-bottom:1px solid #e6f0ee}
.ttab{position:relative;padding:6px 10px;border:0;background:none;color:#6f8b86;font-size:var(--fs-minor);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.ttab:hover{color:var(--teal-d)}
.ttab.on{color:var(--teal-d);font-weight:600;border-bottom-color:var(--teal)}
.ttab .filled-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cyan);margin-left:5px;vertical-align:middle}
.ttab .tab-count{display:inline-block;margin-left:5px;padding:0 5px;border-radius:8px;background:var(--cyan-soft);color:var(--cyan);font-size:var(--fs-note);font-weight:700;font-style:normal;vertical-align:middle}
.test-result:empty{display:none}
.result-box{border:1px solid #bfe4d4;border-radius:8px;background:#fff;overflow:hidden}
.result-box.bad{border-color:#f0c3c3}
.result-top{display:flex;align-items:center;gap:9px;padding:8px 11px;background:var(--green-soft);border-bottom:1px solid #cdeadb;flex-wrap:wrap}

<script>
(() => {
  "use strict";
  const Api = window.MosikaApi;
  const Ns = window.MosikaNs;
  const $ = (s) => document.querySelector(s);
  let filter = "";  // "" | atom | table | off
  let keyword = "";
  let pageNumber = 1;
  const pageSize = 20;
  let total = 0;
  let loadSequence = 0;
  let rules = [];
  let refCount = new Map(); // ruleId(String) -> 引用场景数
  let editing = null;

  const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1800); };
  const esc = (v) => String(v ?? "").replace(/[&<>'"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[c]));

  // 参数模板编辑：参数名由表达式里的 $args.xxx 自动提取，其余字段手工补全。
  const PARAM_TYPES = [["string", "文本"], ["number", "数字"], ["boolean", "布尔"], ["enum", "枚举"]];

  // 当前弹窗的参数状态，manual 表示参数名由人工维护，stale 表示表达式里已不再引用
  let paramState = [];

  // 后端以原始 JSON 字符串透传 params（entity 的 String 字段），此处解析为数组供编辑；非法归一为空数组。
  function parseParamsField(raw) {
    if (Array.isArray(raw)) return raw;
    if (typeof raw !== "string" || !raw.trim()) return [];
    try { const v = JSON.parse(raw); return Array.isArray(v) ? v : []; } catch (_) { return []; }
  }

  // 去掉注释与字符串字面量，避免把注释或字符串里的 $args.xxx 当成真参数
  function stripNonCode(src) {
    return String(src || "")
      .replace(/\/\*[\s\S]*?\*\//g, " ")
      .replace(/\/\/[^\n]*/g, " ")
      .replace(/`(?:\\[\s\S]|[^`\\])*`/g, '""')
      .replace(/'(?:\\[\s\S]|[^'\\\n])*'/g, '""')
      .replace(/"(?:\\[\s\S]|[^"\\\n])*"/g, '""');
  }

  // 提取表达式里引用的参数名，支持 $args.name 与 $args["name"] 两种写法，按出现顺序去重
  function extractArgNames(src) {
    const code = stripNonCode(src);
    const re = /\$args\s*(?:\.\s*([A-Za-z_$][\w$]*)|\[\s*(['"])([^'"\]]+)\2\s*\])/g;
    const names = [];
    let m;
    while ((m = re.exec(code)) !== null) {
      const name = m[1] || m[3];
      if (name && !names.includes(name)) names.push(name);
    }
    return names;
  }

  // 按表达式重算参数列表：新参数追加，已有配置按参数名保留，消失的自动参数标为失效
  function syncParamsFromExpr() {
    const names = extractArgNames(currentExpression());
    const byName = new Map(paramState.map((p) => [p.name, p]));
    const next = [];
    names.forEach((name) => {
      const hit = byName.get(name);
      next.push(hit ? { ...hit, stale: false } : { name, label: "", type: "string", description: "", options: "", default: "", manual: false, stale: false });
      byName.delete(name);
    });
    byName.forEach((p) => {
      if (p.manual) next.push({ ...p, stale: false });
      else next.push({ ...p, stale: true });
    });
    const grew = paramState.length < next.length;
    paramState = next;
    renderParams();
    if (grew) {
      const cards = document.querySelectorAll("#paramsEditor .param-card");
      const last = cards[cards.length - 1];
      if (last) last.scrollIntoView({ block: "nearest" });
    }
  }

  // 把界面上的编辑内容回写到 paramState，避免重渲染丢用户输入
  function absorbParamInputs() {
    document.querySelectorAll("#paramsEditor .param-card").forEach((card) => {
      const idx = Number(card.dataset.idx);
      const p = paramState[idx];
      if (!p) return;
      const get = (k) => card.querySelector(`[data-p="${k}"]`);
      if (p.manual && get("name")) p.name = get("name").value.trim();
      ["label", "type", "description", "options", "default"].forEach((k) => {
        const el = get(k);
        if (el) p[k] = el.value;
      });
    });
  }

  function paramCardHtml(p, idx) {
    const type = PARAM_TYPES.some(([v]) => v === p.type) ? p.type : "string";
    const opts = Array.isArray(p.options) ? p.options.join(", ") : (p.options || "");
    const def = p.default === undefined || p.default === null ? "" : String(p.default);
    const nameCell = p.manual
      ? `<input data-p="name" placeholder="参数名 name *" value="${esc(p.name)}">`
      : `<span class="param-name-fixed" data-name title="来自表达式，不可改名">${esc(p.name)}</span>`;
    if (p.stale) {
      return `<div class="param-card stale" data-param data-idx="${idx}">
        ${nameCell}
        <div class="param-stale-note">表达式中已不再引用，保存时会丢弃</div>
        <button type="button" class="param-remove" data-remove title="立即删除">✕</button>
        <button type="button" class="param-keep" data-keep>仍要保留</button>
      </div>`;
    }
    return `<div class="param-card" data-param data-idx="${idx}">
      ${nameCell}
      <input data-p="label" placeholder="中文名 label" value="${esc(p.label)}">
      <select class="param-type" data-p="type">
        ${PARAM_TYPES.map(([v, t]) => `<option value="${v}" ${v === type ? "selected" : ""}>${t}</option>`).join("")}
      </select>
      <input data-p="default" placeholder="默认值" value="${esc(def)}">
      <input data-p="description" placeholder="说明" value="${esc(p.description)}">
      <button type="button" class="param-remove" data-remove title="删除该参数">✕</button>
      <input data-p="options" placeholder="枚举项，逗号分隔" value="${esc(opts)}" ${type === "enum" ? "" : "hidden"}>
    </div>`;
  }

  function renderParams() {
    const editor = $("#paramsEditor");
    const head = document.querySelector("#ruleDlg .param-head");
    if (head) head.hidden = paramState.length === 0;
    editor.innerHTML = paramState.length
      ? paramState.map(paramCardHtml).join("")
      : `<div class="params-empty">暂无参数</div>`;
    renderTestArgs();
  }

  // 汇总参数为规范化对象数组；失效参数丢弃，name 为空的行忽略。校验失败返回 {error}。
  function collectParams() {
    absorbParamInputs();
    const result = [];
    const seen = new Set();
    for (const p of paramState) {
      if (p.stale) continue;
      const name = String(p.name || "").trim();
      if (!name) continue;
      if (seen.has(name)) return { error: `参数名重复：${name}` };
      seen.add(name);
      const type = PARAM_TYPES.some(([v]) => v === p.type) ? p.type : "string";
      const param = { name, type };
      const label = String(p.label || "").trim();
      if (label) param.label = label;
      const description = String(p.description || "").trim();
      if (description) param.description = description;
      if (type === "enum") {
        const raw = Array.isArray(p.options) ? p.options.join(",") : String(p.options || "");
        const options = raw.split(",").map((s) => s.trim()).filter(Boolean);
        if (!options.length) return { error: `枚举参数「${name}」需至少一个选项` };
        param.options = options;
      }
      const def = String(p.default === undefined || p.default === null ? "" : p.default).trim();
      if (def) param.default = def;
      result.push(param);
    }
    return { params: result };
  }

  async function loadRefCounts() {
    refCount = new Map();
    try {
      const counts = await Api.getRuleRefCounts(Ns.code()); // { ruleId: 引用的已生效流程数 }
      Object.entries(counts || {}).forEach(([rid, n]) => refCount.set(String(rid), n));
    } catch (_) {}
  }

  async function loadRules() {
    const sequence = ++loadSequence;
    $("#rows").innerHTML = `<tr><td colspan="5"><div class="loading">加载中…</div></td></tr>`;
    const params = { keyword, pageNumber, pageSize, namespace: Ns.code() };
    if (filter === "condition") { params.kind = "condition"; params.status = 1; }
    else if (filter === "action") { params.kind = "action"; params.status = 1; }
    else if (filter === "off") params.status = 0;
    else params.status = 1;
    try {
      const page = await Api.listRules(params);
      if (sequence !== loadSequence) return;
      rules = page.items || [];
      total = page.total || 0;
      if (!rules.length && total > 0 && pageNumber > 1) {
        pageNumber -= 1;
        return loadRules();
      }
      $("#subCount").textContent = `共 ${page.total} 条规则`;
      renderRows();
      renderPager();
    } catch (e) {
      if (sequence !== loadSequence) return;
      $("#rows").innerHTML = `<tr><td colspan="5"><div class="empty">加载失败：${esc(e.message)}</div></td></tr>`;
      $("#pager").hidden = true;
    }
  }

  function renderPager() {
    const pages = Math.max(1, Math.ceil(total / pageSize));
    $("#pager").hidden = total <= pageSize;
    $("#pageSummary").textContent = `第 ${pageNumber} / ${pages} 页 · 共 ${total} 条`;
    $("#prevPage").disabled = pageNumber <= 1;
    $("#nextPage").disabled = pageNumber >= pages;
  }

  function renderRows() {
    if (!rules.length) { $("#rows").innerHTML = `<tr><td colspan="5"><div class="empty">暂无业务规则</div></td></tr>`; return; }
    $("#rows").innerHTML = rules.map((r) => {
      const live = r.status === 1;
      const dim = live ? "" : ' style="opacity:.62"';
      const cnt = refCount.get(String(r.ruleId)) || 0;
      const isAction = r.kind === "action";
      const typeTag = isAction ? `<span class="tag action">执行动作</span>` : `<span class="tag cond">判断条件</span>`;
      const toggle = `<button type="button" class="status-toggle ${live ? "is-on" : "is-off"}" role="switch"
          aria-checked="${live}" data-toggle="${r.ruleId}" data-to="${live ? 0 : 1}" aria-label="${esc(r.name)}的启用状态">
          <span class="status-toggle-track" aria-hidden="true"><span class="status-toggle-thumb"></span></span>
          <span class="status-toggle-label">${live ? "启用" : "已停用"}</span>
        </button>`;
      return `<tr${dim}>
        <td><div class="name">${esc(r.name)}<span class="id">${esc(r.namespace)} / ${esc(r.ruleId)}</span></div><div class="rowdesc">${esc(r.description || "—")}</div></td>
        <td><span class="expr">${esc(r.expression)}</span></td>
        <td>${typeTag}</td>
        <td><span class="refbadge ${cnt ? "" : "zero"}"><span class="dot"></span>${cnt} 个业务场景</span></td>
        <td><div class="actions"><button class="btn link" data-edit="${r.ruleId}">编辑</button>${toggle}</div></td>
      </tr>`;
    }).join("");
  }

  let exprEditor = null;
  let udfPaths = [];   // 当前命名空间已注册的自定义函数调用路径，供补全使用

  // 拉取自定义函数调用路径作为补全源；失败不影响编辑
  async function loadUdfPaths() {
    try {
      const page = await Api.listUdfs({ status: 1, pageNumber: 1, pageSize: 200, namespace: Ns.code() });
      udfPaths = (page.items || []).map((u) => (u.group ? `${u.group}.${u.name}` : u.name));
    } catch (_) { udfPaths = []; }
  }

  // acorn 解析表达式，返回 CodeMirror lint 标注；表达式非完整语句，需用括号包裹后解析
  function lintExpression(text) {
    const src = String(text || "").trim();
    if (!src || typeof window.acorn === "undefined") return [];
    try {
      window.acorn.parse(`(\n${src}\n)`, { ecmaVersion: 2020 });
      return [];
    } catch (e) {
      const loc = e.loc || { line: 2, column: 0 };
      const line = Math.max(0, loc.line - 2);
      const col = Math.max(0, loc.column | 0);
      return [{
        message: String(e.message || "语法错误").replace(/\s*\(\d+:\d+\)\s*$/, ""),
        severity: "error",
        from: window.CodeMirror.Pos(line, col),
        to: window.CodeMirror.Pos(line, col + 1)
      }];
    }
  }

  const JS_KEYWORDS = ["true", "false", "null", "undefined", "&&", "||", "!", "includes(", "startsWith(",
    "endsWith(", "indexOf(", "length", "toLowerCase()", "toUpperCase()", "Number(", "String(", "Math.max(",
    "Math.min(", "Array.isArray("];

  // 补全源：$args 参数名 / 自定义函数路径 / 顶层变量与常用 JS
  function exprHint(cm) {
    const cur = cm.getCursor();
    const line = cm.getLine(cur.line).slice(0, cur.ch);
    const argsMatch = line.match(/\$args\.([A-Za-z0-9_]*)$/);
    if (argsMatch) {
      const typed = argsMatch[1];
      const collected = collectParams();
      const defs = collected.error ? [] : collected.params;
      const list = defs
        .filter((p) => p.name.startsWith(typed))
        .map((p) => ({ text: p.name, displayText: `${p.name}　${p.label || ""} · ${p.type}` }));
      return { list, from: window.CodeMirror.Pos(cur.line, cur.ch - typed.length), to: cur };
    }
    const wordMatch = line.match(/[A-Za-z0-9_.$]*$/);
    const typed = wordMatch ? wordMatch[0] : "";
    const pool = ["$", "$$", "$args"].concat(udfPaths).concat(JS_KEYWORDS);
    const list = pool.filter((t) => t.toLowerCase().startsWith(typed.toLowerCase()) && t !== typed);
    return { list, from: window.CodeMirror.Pos(cur.line, cur.ch - typed.length), to: cur };
  }

  function currentExpression() {
    return exprEditor ? exprEditor.getValue() : ($("#fExpr") ? $("#fExpr").value : "");
  }

  // 语法状态灯与行列状态栏跟随编辑器
  function refreshEditorStatus() {
    const cm = exprEditor;
    const text = currentExpression();
    const state = $("#lintState");
    const problems = lintExpression(text);
    if (!text.trim()) {
      state.className = "lint-state";
      state.textContent = "未填写";
    } else if (problems.length) {
      state.className = "lint-state bad";
      state.textContent = "语法错误";
    } else {
      state.className = "lint-state ok";
      state.textContent = "语法通过";
    }
    if (cm) {
      const cur = cm.getCursor();
      $("#exprPos").textContent = `行 ${cur.line + 1} : 列 ${cur.ch + 1}`;
      $("#exprMeta").textContent = `${cm.lineCount()} 行`;
    }
  }

  let extractTimer = null;
  function scheduleExtract() {
    clearTimeout(extractTimer);
    extractTimer = setTimeout(() => {
      absorbParamInputs();
      syncParamsFromExpr();
    }, 400);
  }

  function ensureExprEditor() {
    if (exprEditor || typeof window.CodeMirror === "undefined") return exprEditor;
    exprEditor = window.CodeMirror.fromTextArea(document.getElementById("fExpr"), {
      mode: "javascript",
      lineNumbers: true,
      lineWrapping: true,
      matchBrackets: true,
      autoCloseBrackets: true,
      styleActiveLine: true,
      tabSize: 2,
      gutters: ["CodeMirror-linenumbers", "CodeMirror-lint-markers"],
      lint: { getAnnotations: lintExpression, async: false },
      extraKeys: { "Ctrl-Space": (cm) => cm.showHint({ hint: exprHint, completeSingle: false, container: document.getElementById('ruleDlg') }) }
    });
    // 输入点号或字母时自动弹出补全，不自动选中唯一项以免打断输入
    exprEditor.on("inputRead", (cm, change) => {
      if (!/[A-Za-z0-9_.$]/.test(change.text[0] || "")) return;
      cm.showHint({ hint: exprHint, completeSingle: false, container: document.getElementById('ruleDlg') });
    });
    exprEditor.on("change", () => { refreshEditorStatus(); scheduleExtract(); });
    exprEditor.on("cursorActivity", refreshEditorStatus);
    return exprEditor;
  }

  // 在光标处插入片段并唤出补全，供「插入 $args / 插入 UDF」使用
  function insertSnippet(text) {
    const cm = ensureExprEditor();
    if (!cm) return;
    cm.focus();
    cm.replaceSelection(text);
    cm.showHint({ hint: exprHint, completeSingle: false, container: document.getElementById('ruleDlg') });
  }

  function formatExpression() {
    const cm = ensureExprEditor();
    if (!cm) return;
    const beautify = window.js_beautify || (window.beautify && window.beautify.js);
    if (typeof beautify !== "function") { toast("格式化组件未加载"); return; }
    const src = cm.getValue().trim();
    if (!src) return;
    try {
      cm.setValue(beautify(src, { indent_size: 2, brace_style: "collapse,preserve-inline", wrap_line_length: 0 }));
    } catch (_) { toast("表达式无法格式化，请先修正语法"); }
  }

  // ── 试运行面板 ─────────────────────────────────────────────
  // 按参数模板渲染取值表单。数字一律用文本框：input[type=number] 在初值非法时会直接丢弃内容
  function renderTestArgs() {
    const box = $("#tArgs");
    if (!box) return;
    const prev = readTestArgsRaw();
    const items = paramState.filter((p) => !p.stale && String(p.name || "").trim());
    if (!items.length) {
      box.innerHTML = `<div class="targs-empty">无参数</div>`;
      refreshArgsCount();
      return;
    }
    box.innerHTML = items.map((p) => {
      const name = String(p.name).trim();
      const type = PARAM_TYPES.some(([v]) => v === p.type) ? p.type : "string";
      const typeText = (PARAM_TYPES.find(([v]) => v === type) || [, type])[1];
      const had = Object.prototype.hasOwnProperty.call(prev, name);
      const value = had ? prev[name] : (p.default === undefined || p.default === null ? "" : String(p.default));
      const meta = `${p.label ? esc(p.label) + " · " : ""}${typeText}`;
      let control;
      if (type === "boolean") {
        control = `<select data-arg="${esc(name)}" data-type="boolean">
          <option value="true" ${value === "true" ? "selected" : ""}>true</option>
          <option value="false" ${value !== "true" ? "selected" : ""}>false</option>
        </select>`;
      } else if (type === "enum") {
        const raw = Array.isArray(p.options) ? p.options.join(",") : String(p.options || "");
        const options = raw.split(",").map((s) => s.trim()).filter(Boolean);
        control = `<select data-arg="${esc(name)}" data-type="enum">
          ${options.map((o) => `<option value="${esc(o)}" ${o === value ? "selected" : ""}>${esc(o)}</option>`).join("")}
        </select>`;
      } else {
        control = `<input data-arg="${esc(name)}" data-type="${type}" value="${esc(value)}" placeholder="${type === "number" ? "数字" : "文本"}">`;
      }
      return `<div class="targ"><span class="targ-name">${esc(name)}<small>${meta}</small></span>${control}</div>`;
    }).join("");
    refreshArgsCount();
  }

  function readTestArgsRaw() {
    const out = {};
    document.querySelectorAll("#tArgs [data-arg]").forEach((el) => { out[el.dataset.arg] = el.value; });
    return out;
  }

  // 按声明类型转换取值；空字符串视为未填写，不进 args
  function collectTestArgs() {
    const args = {};
    for (const el of document.querySelectorAll("#tArgs [data-arg]")) {
      const name = el.dataset.arg;
      const raw = String(el.value ?? "").trim();
      if (!raw) continue;
      if (el.dataset.type === "number") {
        const n = Number(raw);
        if (!Number.isFinite(n)) return { error: `参数「${name}」不是合法数字：${raw}` };
        args[name] = n;
      } else if (el.dataset.type === "boolean") {
        args[name] = raw === "true";
      } else {
        args[name] = raw;
      }
    }
    return { args };
  }

  function parseJsonField(text, label) {
    const raw = String(text || "").trim();
    if (!raw) return { value: undefined };
    try { return { value: JSON.parse(raw) }; }
    catch (e) { return { error: `${label} 不是合法 JSON：${e.message}` }; }
  }

  function renderTestResult(html) { $("#tResult").innerHTML = html; }

  // 规则说明按本次输入插值。core 用 String.raw`...` 求值，这里用同样语义在本地渲染，
  // $ / $$ / $args 三样输入测试面板里都有，不必绕后端
  function renderDescription(template, target, context, args) {
    const raw = String(template || "");
    if (!raw.trim()) return { text: "" };
    try {
      const render = new Function("$", "$$", "$args", "return String.raw`" + raw + "`");
      return { text: String(render(target, context, args)) };
    } catch (e) {
      return { error: String(e && e.message ? e.message : e) };
    }
  }

  function renderTestError(message) {
    renderTestResult(`<div class="result-box bad">
      <div class="result-top"><span class="result-badge err">失败</span></div>
      <div class="result-message">${esc(message)}</div>
    </div>`);
  }

  async function runExpression() {
    const expression = currentExpression().trim();
    if (!expression) { renderTestError("表达式不能为空"); return; }
    if (!validateJsonField($("#tTarget"))) { switchTestPane("target"); $("#tTarget").focus(); return; }
    if (!validateJsonField($("#tContext"))) { switchTestPane("context"); $("#tContext").focus(); return; }
    const target = parseJsonField($("#tTarget").value, "入参 $");
    const context = parseJsonField($("#tContext").value, "上下文 $$");
    const collected = collectTestArgs();
    if (collected.error) { renderTestError(collected.error); return; }
    const btn = $("#runExprBtn");
    btn.disabled = true;
    renderTestResult(`<div class="result-box"><div class="result-body">运行中…</div></div>`);
    const started = performance.now();
    try {
      const data = await Api.tryRule({
        namespace: Ns.code(), expression,
        args: collected.args,
        target: target.value === undefined ? null : target.value,
        context: context.value === undefined ? null : context.value
      });
      const cost = Math.round(performance.now() - started);
      const result = data ? data.result : undefined;
      const isBool = typeof result === "boolean";
      const badge = isBool
        ? `<span class="result-badge ${result ? "" : "no"}">${result}</span>`
        : `<span class="result-badge">已返回</span>`;
      // 规则说明按本次输入渲染，和结果一起给出
      const rendered = renderDescription($("#fDesc").value,
        target.value === undefined ? null : target.value,
        context.value === undefined ? {} : context.value,
        collected.args);
      const descRow = rendered.error
        ? `<div class="result-desc bad"><span>说明</span><code>渲染失败：${esc(rendered.error)}</code></div>`
        : (rendered.text ? `<div class="result-desc"><span>说明</span><code>${esc(rendered.text)}</code></div>` : "");
      // 布尔结果已经在徽标上，正文只回显本次实际输入；非布尔结果单独展示返回值
      const echo = [["$", target.value === undefined ? null : target.value]];
      if (Object.keys(collected.args).length) echo.push(["$args", collected.args]);
      if (context.value !== undefined && context.value !== null) echo.push(["$$", context.value]);
      const returned = isBool ? "" : `<div class="result-value"><div><span>返回值</span><code>${
        esc(typeof result === "object" && result !== null ? JSON.stringify(result, null, 2) : String(result))}</code></div></div>`;
      const rows = echo.map(([k, v]) => `<div><span>${k}</span><code>${esc(JSON.stringify(v))}</code></div>`).join("");
      renderTestResult(`<div class="result-box">
        <div class="result-top">${badge}<small>${cost} ms</small></div>
        ${descRow}
        ${returned}
        <div class="result-echo">${rows}</div>
      </div>`);
    } catch (e) {
      renderTestError(e.message || "运行失败");
    } finally {
      btn.disabled = false;
    }
  }

  // 入参 / 参数 / 上下文 三页切换。非当前页的内容一样参与运行，
  // 所以参数页标出个数、上下文页标出已填写，避免看不见的输入悄悄影响结果
  function switchTestPane(pane) {
    document.querySelectorAll("#ruleDlg .ttab").forEach((b) => b.classList.toggle("on", b.dataset.tab === pane));
    document.querySelectorAll("#ruleDlg .tpane").forEach((a) => { a.hidden = a.dataset.pane !== pane; });
  }

  // {} 视为空上下文，只有填了实际内容才点亮圆点
  function refreshCtxDot() {
    const v = String($("#tContext").value || "").trim();
    $("#ctxDot").hidden = v === "" || v === "{}";
  }

  // 实时校验 JSON 输入框；合法返回 true，非法标红并给出错误行
  function validateJsonField(area) {
    const errBox = document.querySelector(`[data-json-err="${area.dataset.pane}"]`);
    const raw = String(area.value || "").trim();
    let ok = true, msg = "";
    if (raw) {
      try { JSON.parse(raw); }
      catch (e) { ok = false; msg = String(e.message || "").replace(/^JSON\.parse:\s*/, "").replace(/\s+in JSON.*$/, ""); }
    }
    area.classList.toggle("invalid", !ok);
    if (errBox) { errBox.hidden = ok; errBox.textContent = ok ? "" : `不是合法 JSON：${msg}`; }
    return ok;
  }

  function refreshArgsCount() {
    const count = document.querySelectorAll("#tArgs [data-arg]").length;
    const badge = $("#argsCount");
    badge.hidden = count === 0;
    badge.textContent = count;
  }

  // 弹窗分页：编辑页藏起来时 CodeMirror 量不到尺寸，切回来必须 refresh
  function switchDialogPane(pane) {
    document.querySelectorAll("#ruleDlg .dtab").forEach((b) => b.classList.toggle("on", b.dataset.dtab === pane));
    document.querySelectorAll("#ruleDlg .dpane").forEach((p) => { p.hidden = p.dataset.dpane !== pane; });
    if (pane === "edit" && exprEditor) requestAnimationFrame(() => exprEditor.refresh());
  }

  function resetTestPanel() {
    $("#tTarget").value = "{}";
    $("#tContext").value = "{}";
    document.querySelectorAll("#ruleDlg [data-json]").forEach((a) => validateJsonField(a));
    switchTestPane("target");
    switchDialogPane("edit");
    refreshCtxDot();
    renderTestResult("");
  }

  function openDialog(rule) {
    editing = rule || null;
    $("#dlgTitle").textContent = rule ? "编辑规则" : "新建规则";
    $("#fName").value = rule ? (rule.name || "") : "";
    $("#fDesc").value = rule ? (rule.description || "") : "";
    const kind = rule && rule.kind === "action" ? "action" : "condition";
    $(`input[name="fKind"][value="${kind}"]`).checked = true;
    const expr = rule ? (rule.expression || "") : "";
    $("#fExpr").value = expr;
    // 已保存参数里在表达式中找不到的，按手动参数处理，避免打开旧规则时一片标黄
    const exprNames = extractArgNames(expr);
    paramState = parseParamsField(rule ? rule.params : null).map((p) => ({
      name: String(p.name || ""),
      label: p.label || "",
      type: p.type || "string",
      description: p.description || "",
      options: Array.isArray(p.options) ? p.options.join(", ") : (p.options || ""),
      default: p.default === undefined || p.default === null ? "" : String(p.default),
      manual: !exprNames.includes(String(p.name || "")),
      stale: false
    }));
    resetTestPanel();
    $("#ruleDlg").showModal();
    loadUdfPaths();
    const cm = ensureExprEditor();
    if (cm) {
      cm.setValue(expr);
      // 弹窗 showModal 后编辑器才可见，需 refresh 才能正确布局高度/行号
      requestAnimationFrame(() => { cm.refresh(); });
    }
    syncParamsFromExpr();
    refreshEditorStatus();
    requestAnimationFrame(() => $("#fName").focus());
  }

  async function saveRule() {
    const name = $("#fName").value.trim();
    const expression = (exprEditor ? exprEditor.getValue() : $("#fExpr").value).trim();
    if (!name) { toast("规则名称不能为空"); return; }
    if (!expression) { toast("表达式不能为空"); return; }
    const collected = collectParams();
    if (collected.error) { toast(collected.error); return; }
    const body = {
      name, namespace: Ns.code(),
      description: $("#fDesc").value.trim(), expression, kind: $('input[name="fKind"]:checked').value,
      params: JSON.stringify(collected.params)
    };
    try {
      if (editing) { body.ruleId = editing.ruleId; body.version = editing.version; await Api.updateRule(editing.ruleId, body); }
      else { await Api.createRule(body); }
      $("#ruleDlg").close();
      toast("已保存");
      await refresh();
    } catch (e) { toast("保存失败：" + e.message); }
  }

  async function toggleRule(id, to) {
    const r = rules.find((x) => x.ruleId === id); if (!r) return;
    if (to === 0) {
      const cnt = refCount.get(String(id)) || 0;
      const tip = cnt > 0
        ? `该规则仍被 ${cnt} 个业务场景引用。停用（下架）后：新场景将无法再选用它，但已在使用的场景仍会继续正常运行。确定停用？`
        : "确定停用该规则？停用后新场景将无法再选用它。";
      if (!window.confirm(tip)) return;
    }
    try {
      if (to === 0) await Api.disableRule(id, r.version);
      else await Api.enableRule(id, r.version);
      toast(to === 0 ? "已停用" : "已启用");
      refresh();
    } catch (e) {
      const m = String(e.message || "");
      let msg;
      if (m.includes("compile failed")) msg = "规则表达式无法编译，请检查表达式后重试。";
      else if (m.includes("updated by others") || m.includes("version")) msg = "该规则已被其他操作修改，请刷新后重试。";
      else msg = "操作失败：" + m;
      toast(msg);
    }
  }

  async function refresh() { await loadRefCounts(); await loadRules(); }

  $("#rows").addEventListener("click", (e) => {
    const ed = e.target.closest("[data-edit]"); if (ed) { const r = rules.find((x) => x.ruleId === ed.dataset.edit); return openDialog(r); }
    const t = e.target.closest("[data-toggle]"); if (t) return toggleRule(t.dataset.toggle, Number(t.dataset.to));
  });
  $("#filters").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip"); if (!chip) return;
    document.querySelectorAll("#filters .chip").forEach((c) => c.classList.remove("on"));
    chip.classList.add("on"); filter = chip.dataset.f; pageNumber = 1; loadRules();
  });
  let searchTimer;
  $("#searchInput").addEventListener("input", (e) => { keyword = e.target.value.trim(); pageNumber = 1; clearTimeout(searchTimer); searchTimer = setTimeout(loadRules, 250); });
  $("#prevPage").addEventListener("click", () => { if (pageNumber > 1) { pageNumber -= 1; loadRules(); } });
  $("#nextPage").addEventListener("click", () => { if (pageNumber * pageSize < total) { pageNumber += 1; loadRules(); } });
  $("#newRuleBtn").addEventListener("click", () => openDialog(null));
  $("#dlgCancel").addEventListener("click", () => $("#ruleDlg").close());
  $("#dlgSave").addEventListener("click", saveRule);
  $("#addParamBtn").addEventListener("click", () => {
    absorbParamInputs();
    paramState.push({ name: "", label: "", type: "string", description: "", options: "", default: "", manual: true, stale: false });
    renderParams();
    // 新行常在滚动区外，必须滚过去并聚焦，否则看起来像没反应
    const cards = document.querySelectorAll("#paramsEditor .param-card");
    const last = cards[cards.length - 1];
    if (!last) return;
    last.scrollIntoView({ block: "nearest" });
    last.classList.add("flash");
    setTimeout(() => last.classList.remove("flash"), 900);
    const input = last.querySelector('[data-p="name"]');
    if (input) input.focus();
  });
  $("#reExtractBtn").addEventListener("click", () => { absorbParamInputs(); syncParamsFromExpr(); });
  $("#paramsEditor").addEventListener("click", (e) => {
    const card = e.target.closest(".param-card");
    if (!card) return;
    const idx = Number(card.dataset.idx);
    if (e.target.closest("[data-remove]")) {
      absorbParamInputs();
      paramState.splice(idx, 1);
      renderParams();
      return;
    }
    if (e.target.closest("[data-keep]")) {
      absorbParamInputs();
      if (paramState[idx]) { paramState[idx].stale = false; paramState[idx].manual = true; }
      renderParams();
    }
  });
  $("#paramsEditor").addEventListener("change", (e) => {
    if (e.target.matches('[data-p="type"]')) {
      const card = e.target.closest(".param-card");
      const options = card.querySelector('[data-p="options"]');
      if (options) options.hidden = e.target.value !== "enum";
      absorbParamInputs();
      renderTestArgs();
    }
  });
  // 参数名/中文名/默认值等改动要同步到试运行表单的取值行
  $("#paramsEditor").addEventListener("input", (e) => {
    if (!e.target.matches("[data-p]")) return;
    absorbParamInputs();
    renderTestArgs();
  });
  $("#fmtExprBtn").addEventListener("click", formatExpression);
  $("#insArgsBtn").addEventListener("click", () => insertSnippet("$args."));
  $("#insUdfBtn").addEventListener("click", () => insertSnippet(""));
  $("#runExprBtn").addEventListener("click", runExpression);
  document.querySelectorAll("#ruleDlg .ttab").forEach((b) => {
    b.addEventListener("click", () => switchTestPane(b.dataset.tab));
  });
  document.querySelectorAll("#ruleDlg [data-json]").forEach((a) => {
    a.addEventListener("input", () => { validateJsonField(a); if (a.id === "tContext") refreshCtxDot(); });
  });
  document.querySelectorAll("#ruleDlg .dtab").forEach((b) => {
    b.addEventListener("click", () => switchDialogPane(b.dataset.dtab));
  });

  (async () => {
    const ctx = await Ns.boot();
    if (!ctx) return;
    Ns.mountSelector($("#nsSlot"));
    Ns.applyTabs();
    await refresh();
  })();
})();
</script>
</body>
</html>
