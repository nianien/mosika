<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>业务场景 · Mosika</title>
    <link rel="icon" type="image/svg+xml" href="/ui/logo.svg">
    <link rel="stylesheet" href="/ui/tokens.css?v=20260813-1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* hidden 属性兜底：带 display 的类（.pager/.targs 等）会盖掉 UA 的 [hidden]{display:none} */
[hidden]{display:none!important}
.app-shell{height:100vh;display:grid;grid-template-rows:58px minmax(0,1fr);position:relative}
.topbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:24px;padding:0 22px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.96);box-shadow:0 2px 12px rgba(20,80,72,.05);}
.brandwrap{display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:11px}
.brand-home{color:inherit;text-decoration:none;border-radius:10px}
.brand-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:#fff;font-weight:800;background:linear-gradient(145deg,#2fd6c6,#0f9d8a);box-shadow:0 5px 12px rgba(15,157,138,.32)}
.brand-home .brand-mark{transition:transform .16s ease,box-shadow .16s ease}.brand-home:hover{color:var(--teal-d)}.brand-home:hover .brand-mark{transform:translateY(-1px);box-shadow:0 7px 16px rgba(15,157,138,.4)}.brand-home:focus-visible{outline:2px solid var(--teal);outline-offset:4px}
.brand b{font-size:var(--fs-panel)}.brand small{display:block;color:#6f8b86;font-size:var(--fs-caption);margin-top:1px}
.tabs{display:flex;gap:6px}
.tab{height:32px;padding:0 14px;border-radius:8px;font-size:var(--fs-base);color:#5c766f;display:flex;align-items:center;cursor:pointer;text-decoration:none}
.tab.on{background:var(--teal-soft);color:var(--teal-d);font-weight:600}
.top-right{display:flex;align-items:center;gap:12px}
.search{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:var(--fs-panel)}/* 该字号只作用于框内 🔍 字形，输入框自带 --fs-base */
.search input{border:none;outline:none;font-size:var(--fs-base);width:200px;background:transparent;color:#123038}
.btn{height:34px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:#fff;color:#2c5049;font-size:var(--fs-base);cursor:pointer}
.btn:hover{border-color:#a9d3cc;background:#f5faf9}
.btn.primary{color:#fff;border-color:var(--teal);background:var(--teal);font-weight:600}
.btn.primary:hover{background:var(--teal-d)}
.btn.danger{color:#fff;border-color:#cf5552;background:#cf5552;font-weight:600}
.btn.danger:hover{border-color:#b94340;background:#b94340}
.btn.link{border:none;background:none;color:var(--teal-d);padding:0 6px;height:auto;cursor:pointer}
.main{overflow:auto;padding:24px 28px 32px}
.workspace-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:12px}
.workspace-title{display:flex;align-items:baseline;gap:10px;min-width:max-content}
.workspace-title h2{font-size:var(--fs-title)}
.workspace-title .sub{color:#7f9791;font-size:var(--fs-meta)}
.workspace-tools{display:flex;align-items:center;justify-content:flex-end;gap:12px;min-width:0}
.filters{display:flex;gap:8px}
.chip{height:30px;padding:0 14px;border-radius:16px;border:1px solid var(--border);background:#fff;color:#54706a;font-size:var(--fs-meta);display:flex;align-items:center;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--teal-soft);border-color:#9fd8cf;color:var(--teal-d);font-weight:600}
.panel{background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(20,80,72,.05)}
.table-scroll{overflow-x:auto}table{width:100%;min-width:820px;border-collapse:collapse;font-size:var(--fs-base)}
thead th{text-align:left;padding:13px 18px;color:#6f8b86;font-weight:600;font-size:var(--fs-meta);background:#f4faf9;border-bottom:1px solid var(--border)}
tbody td{padding:15px 18px;border-bottom:1px solid #eef4f2;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f7fcfb}
.name{font-weight:600;font-size:var(--fs-strong)}
.name .id{color:#9fb4af;font-weight:400;font-size:var(--fs-caption);margin-left:7px}
.rowdesc{color:#71887f;font-size:var(--fs-minor);margin-top:3px;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:var(--fs-label);font-weight:600;padding:3px 9px;border-radius:11px;white-space:nowrap}
.pill.live{color:var(--green);background:var(--green-soft)}
.pill.draft{color:#b5852a;background:#fbf1d9}
.pill.off{color:var(--grey);background:var(--grey-soft)}
.pill.history{color:#60716d;background:#edf3f1}
.num{font-variant-numeric:tabular-nums;color:#3f5f58}
.time{color:#8aa39d;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:14px;align-items:center;justify-content:flex-end;white-space:nowrap}
.actions .open{appearance:none;box-shadow:none;color:var(--teal-d);background:var(--teal-soft);border:1px solid #9fd8cf;border-radius:7px;height:28px;padding:0 16px;font-weight:600;font-size:var(--fs-meta);cursor:pointer}
.actions .open:hover{background:#cdeee7;border-color:#7fccc0}
.status-toggle{width:104px;height:28px;padding:0;border:0;background:transparent;display:grid;grid-template-columns:34px 1fr;align-items:center;gap:7px;justify-self:end;color:#71887f;cursor:pointer;text-align:left}
.status-toggle-track{width:34px;height:19px;border-radius:10px;background:#cbd8d5;position:relative;transition:background .18s ease,box-shadow .18s ease}
.status-toggle-thumb{position:absolute;top:3px;left:3px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(18,48,56,.28);transition:transform .18s ease}
.status-toggle.is-on{color:var(--teal-d);font-weight:600}.status-toggle.is-on .status-toggle-track{background:var(--teal)}.status-toggle.is-on .status-toggle-thumb{transform:translateX(15px)}
.status-toggle.is-draft{color:#a67823}.status-toggle.is-draft .status-toggle-track{background:#e4c77c}
.status-toggle:hover .status-toggle-track{box-shadow:0 0 0 3px rgba(15,157,138,.12)}
.status-toggle:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:7px}
.status-toggle:disabled{cursor:wait;opacity:.58}.status-toggle.is-pending .status-toggle-track{animation:switchPulse .8s ease-in-out infinite alternate}
.status-toggle-label{font-size:var(--fs-meta);line-height:1}
@keyframes switchPulse{to{opacity:.5}}
.empty,.loading{padding:60px 20px;text-align:center;color:#8aa39d;font-size:var(--fs-field)}
.pager{min-height:52px;padding:10px 16px;border-top:1px solid #eef4f2;display:flex;align-items:center;justify-content:flex-end;gap:10px;color:#71887f;font-size:var(--fs-meta)}.pager button{height:30px;padding:0 12px;border:1px solid var(--border);border-radius:7px;background:#fff;color:#355d55;cursor:pointer;font-size:var(--fs-meta)}.pager button:disabled{opacity:.45;cursor:not-allowed}
/* drawer */
.scrim{position:absolute;inset:58px 0 0 0;background:rgba(18,48,56,.28);display:none}
.scrim.show{display:block}
.drawer{position:absolute;top:0;right:0;bottom:0;width:460px;max-width:92vw;background:#fff;box-shadow:-14px 0 40px rgba(18,48,56,.18);display:none;flex-direction:column;border-left:1px solid var(--border);z-index:6}
.drawer.show{display:flex}
.dw-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid #eef4f2}
.dw-head h2{font-size:var(--fs-title);display:flex;align-items:center;gap:10px}
.x{width:30px;height:30px;border:1px solid var(--border);border-radius:8px;background:#fff;color:#6f8b86;cursor:pointer;font-size:15px}/* × 字形，不纳入文字刻度 */
.dw-body{padding:20px 22px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.field label{display:block;font-size:var(--fs-meta);color:#5c766f;margin-bottom:7px;font-weight:600}
.field input,.field textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:var(--fs-field);color:#123038;background:#fff;font-family:inherit}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.field textarea{min-height:80px;resize:vertical;line-height:1.55}
.hint{font-size:var(--fs-caption);color:#93a89f;margin-top:6px}
.metarow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metabox{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:#f8fcfb}
.metabox .k{font-size:var(--fs-caption);color:#6f8b86}.metabox .v{font-size:var(--fs-title);font-weight:700;color:#234;margin-top:3px}
.sec-title{font-size:var(--fs-minor);color:#6f8b86;font-weight:600;letter-spacing:.3px;margin-bottom:10px}
.rules{display:flex;flex-wrap:wrap;gap:7px}
.rtag{background:#f4faf9;border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:var(--fs-minor);color:#3f5f58;display:flex;gap:6px;align-items:center}
.rtag .rid{color:#a7c0ba;font-size:var(--fs-note)}
.statusseg{display:flex;gap:8px}
.seg{flex:1;text-align:center;padding:8px 0;border:1px solid var(--border);border-radius:9px;font-size:var(--fs-meta);color:#5c766f;cursor:pointer;background:#fff}
.seg.on{background:var(--teal-soft);border-color:#9fd8cf;color:var(--teal-d);font-weight:600}
.dw-foot{display:flex;align-items:center;gap:10px;padding:16px 22px;border-top:1px solid #eef4f2}
.dw-foot .grow{flex:1}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#123038;color:#fff;padding:10px 18px;border-radius:10px;font-size:var(--fs-base);opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:.95}
dialog{border:none;border-radius:14px;padding:0;margin:auto;box-shadow:0 20px 60px rgba(18,48,56,.28);width:min(420px,92vw)}
dialog::backdrop{background:rgba(18,48,56,.3)}
#newDlg{width:min(720px,94vw)}
#newDlg .dlg-body{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;align-items:stretch}
#newDlg .dlg-body>.field{display:flex;flex-direction:column;height:100%}
#newDlg .dlg-body>.field>.hint{margin-top:auto;padding-top:6px}
#newDlg .dlg-body>.field.span-2{grid-column:1/-1}
@media(max-width:900px){#newDlg .dlg-body{grid-template-columns:1fr}#newDlg .dlg-body>.field.span-2{grid-column:1}}
.dlg-head{padding:18px 24px 6px;font-size:var(--fs-title);font-weight:700}
.dlg-body{padding:12px 24px;display:flex;flex-direction:column;gap:14px}
.dlg-foot{padding:14px 24px 20px;display:flex;justify-content:flex-end;gap:10px}
.confirm-message{font-size:var(--fs-base);color:#23443d;line-height:1.6}
.confirm-note{padding:10px 12px;border-radius:8px;background:#f4faf9;color:#6f8b86;font-size:var(--fs-minor);line-height:1.55}
@media(max-width:1100px){.workspace-head{align-items:flex-start;flex-direction:column}.workspace-tools{width:100%;justify-content:space-between}}
@media(max-width:800px){.app-shell{height:auto;min-height:100vh;grid-template-rows:auto minmax(0,1fr)}.topbar{grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;padding:10px 14px}.brandwrap{min-width:0;gap:10px}.brand-mark{width:32px;height:32px}.tabs{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:repeat(3,1fr);width:100%;gap:6px}.tab{justify-content:center;white-space:nowrap}.top-right{grid-column:2;grid-row:1;width:auto}.main{padding:16px 12px 24px}.workspace-tools{align-items:stretch;flex-direction:column}.search{width:100%}.search input{width:100%}.filters{max-width:100%;overflow-x:auto;padding-bottom:2px}.drawer{width:100%;max-width:100vw}.pager{justify-content:space-between}}
</style>

<body class="control-page">
<div class="app-shell">
  <div class="topbar">
    <div class="brandwrap">
      <a class="brand brand-home" href="/" aria-label="返回 Mosika 首页"><div class="brand-mark"><img src="/ui/logo.svg" alt=""></div><b>Mosika</b></a>
      <div id="nsSlot"></div>
    </div>
    <div class="tabs"><a class="tab on" href="/scenes">业务场景</a><a class="tab" href="/rules">业务规则</a><a class="tab" href="/udfs">自定义函数</a></div>
    <div class="top-right">
      <button class="btn primary" id="newFlowBtn">＋ 新建场景</button>
    </div>
  </div>
  <div class="main">
    <section aria-labelledby="sceneTitle">
      <div class="workspace-head">
        <div class="workspace-title"><h2 id="sceneTitle">业务场景</h2><span class="sub" id="subCount">加载中…</span></div>
        <div class="workspace-tools">
          <div class="search">🔍 <input id="searchInput" placeholder="搜索场景名称 / 描述" aria-label="搜索业务场景"></div>
          <div class="filters" id="filters">
            <button type="button" class="chip on" data-status="1">当前发布</button>
            <button type="button" class="chip" data-status="0">草稿</button>
            <button type="button" class="chip" data-status="3">历史版本</button>
            <button type="button" class="chip" data-status="2">已停用</button>
          </div>
        </div>
      </div>
      <div class="core-context" aria-label="场景编译链路">
        <span class="core-context-label">Compile path</span>
        <span class="core-chain"><b>UI AST</b><i>→</i><b>RuleNode</b><i>→</i><b>RuleSuite</b></span>
        <span class="core-context-note">草稿保留编辑模型，发布前完成结构校验与单向编译</span>
      </div>
      <div class="panel">
        <div class="table-scroll"><table>
          <thead><tr><th style="width:46%">场景 / 描述</th><th>引用规则</th><th>更新时间</th><th style="width:320px;text-align:right">操作</th></tr></thead>
          <tbody id="rows"><tr><td colspan="4"><div class="loading">加载中…</div></td></tr></tbody>
        </table></div>
        <div class="pager" id="pager" hidden><span id="pageSummary"></span><span><button type="button" id="prevPage">上一页</button> <button type="button" id="nextPage">下一页</button></span></div>
      </div>
    </section>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <div class="dw-head"><h2 id="drawerTitle">场景详情 <span class="pill live" id="dwStatusPill">当前发布</span></h2><button class="x" id="dwClose" aria-label="关闭">✕</button></div>
    <div class="dw-body">
      <div class="field"><label>场景名称</label><input id="dwName" maxlength="60"></div>
      <div class="field"><label>场景描述</label><textarea id="dwDesc" maxlength="500"></textarea><div class="hint" id="dwEditHint">当前版本只读</div></div>
      <div>
        <div class="sec-title">概览</div>
        <div class="metarow">
          <div class="metabox"><div class="k">引用规则</div><div class="v" id="dwRuleCount">0</div></div>
          <div class="metabox"><div class="k">流程节点</div><div class="v" id="dwNodeCount">0</div></div>
          <div class="metabox"><div class="k">版本</div><div class="v" id="dwVersion">v0</div></div>
          <div class="metabox"><div class="k">最近更新</div><div class="v" id="dwUpdated" style="font-size:var(--fs-base);padding-top:4px">-</div></div>
        </div>
      </div>
      <div>
        <div class="sec-title">引用的规则</div>
        <div class="rules" id="dwRules"></div>
      </div>
    </div>
    <div class="dw-foot"><button class="btn" id="dwCancel">取消</button><span class="grow"></span><button class="btn" id="dwSave">保存</button><button class="btn primary" id="dwOpen">编排 →</button></div>
  </aside>
</div>

<dialog id="newDlg">
  <div class="dlg-head">新建场景</div>
  <div class="dlg-body">
    <div class="field"><label>场景名称 *</label><input id="newName" placeholder="如：准入场景"></div>
    <div class="field span-2"><label>场景描述</label><textarea id="newDesc" placeholder="场景用途"></textarea></div>
  </div>
  <div class="dlg-foot"><button class="btn" id="newCancel">取消</button><button class="btn primary" id="newCreate">创建并编排</button></div>
</dialog>

<dialog id="statusDlg" aria-labelledby="statusDlgTitle" aria-describedby="statusDlgMessage statusDlgNote">
  <div class="dlg-head" id="statusDlgTitle">确认变更状态</div>

    <p class="confirm-message" id="statusDlgMessage"></p>
    <p class="confirm-note" id="statusDlgNote"></p>
  </div>

<dialog id="errDlg" aria-labelledby="errDlgTitle" aria-describedby="errDlgMessage">
  <div class="dlg-head" id="errDlgTitle">操作未完成</div>
  <div class="dlg-body">
    <p class="confirm-message" id="errDlgMessage"></p>
    <p class="confirm-note" id="errDlgDetail" hidden></p>
  </div>
  <div class="dlg-foot"><button class="btn primary" id="errDlgClose">知道了</button></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";
  const Api = window.MosikaApi;
  const Ns = window.MosikaNs;
  const Ui = window.MosikaUi;
  const $ = Ui.$;
  let statusFilter = "1";
  let keyword = "";
  let pageNumber = 1;
  const pageSize = 20;
  let total = 0;
  let loadSequence = 0;
  let flows = [];
  let ruleNameById = new Map();
  let current = null; // drawer 当前 flow
  let drawerOpener = null;
  let drawerSaving = false;
  let statusDialogTarget = null;
  const pendingFlowIds = new Set();

  const toast = Ui.createToast("#toast", { duration: 2000 });
  const esc = Ui.escapeHtml;

  // 把后端英文技术错误映射为可读中文；返回 {msg, detail}。detail 为原始信息（仅在有助于排查时展示）。
  function friendlyError(raw) {
    const m = String(raw || "");
    if (m.includes("rule kind does not match")) {
      return { msg: "规则类型与节点位置不匹配：条件位置只能引用「判断条件」、动作位置只能引用「执行动作」。请到编排画布检查并调整后再发布。", detail: m };
    }
    if (m.includes("unknown or disabled rule")) {
      return { msg: "引用了不存在或已停用的规则，请先到「业务规则」中启用相关规则后再重试。", detail: m };
    }
    if (m.includes("must use numeric") || m.includes("built-in reference")) {
      return { msg: "存在不受支持的规则引用，请到编排画布检查引用后再发布。", detail: m };
    }
    if (m.includes("structural validation") || m.includes("compile failed") || m.includes("ruleTree")) {
      return { msg: "场景结构校验未通过，请到编排画布修正后再发布。", detail: m };
    }
    if (m.includes("updated by others") || m.includes("version")) {
      return { msg: "该场景已被其他操作修改，请刷新页面后重试。", detail: "" };
    }
    return { msg: m || "操作未完成，请稍后重试。", detail: "" };
  }

  function showError(raw, title) {
    const { msg, detail } = friendlyError(raw);
    $("#errDlgTitle").textContent = title || "操作未完成";
    $("#errDlgMessage").textContent = msg;
    const d = $("#errDlgDetail");
    if (detail && detail !== msg) { d.textContent = detail; d.hidden = false; } else { d.hidden = true; }
    const dlg = $("#errDlg");
    if (!dlg.open) dlg.showModal();
  }

  async function loadReferenceNames() {
    ruleNameById = new Map();
    try {
      const groups = await Promise.all([
        Api.listRuleReferences(Ns.code()), Api.listFlowReferences(Ns.code())
      ]);
      groups.flat().forEach((item) => {
        const id = item.ruleId || item.flowId;
        if (id) ruleNameById.set(String(id), item.name || item.description || String(id));
      });
    } catch (_) { /* 引用名称不是列表主链路 */ }
  }

  async function loadFlows() {
    const sequence = ++loadSequence;
    $("#rows").innerHTML = `<tr><td colspan="4"><div class="loading">加载中…</div></td></tr>`;
    try {
      const page = await Api.listFlows({ status: statusFilter, keyword, pageNumber, pageSize, namespace: Ns.code() });
      if (sequence !== loadSequence) return;
      flows = page.items || [];
      total = page.total || 0;
      if (!flows.length && total > 0 && pageNumber > 1) {
        pageNumber -= 1;
        return loadFlows();
      }
      $("#subCount").textContent = `共 ${page.total} 个版本`;
      renderRows();
      renderPager();
    } catch (e) {
      if (sequence !== loadSequence) return;
      $("#rows").innerHTML = `<tr><td colspan="4"><div class="empty">加载失败：${esc(e.message)}</div></td></tr>`;
      $("#pager").hidden = true;
    }
  }

  function renderPager() {
    const pages = Math.max(1, Math.ceil(total / pageSize));
    $("#pager").hidden = total <= pageSize;
    $("#pageSummary").textContent = `第 ${pageNumber} / ${pages} 页 · 共 ${total} 条`;
    $("#prevPage").disabled = pageNumber <= 1;
    $("#nextPage").disabled = pageNumber >= pages;
  }

  const STATUS_META = {
    0: { label: "草稿", cls: "draft" },
    1: { label: "当前发布", cls: "live" },
    2: { label: "已停用", cls: "off" },
    3: { label: "历史版本", cls: "history" }
  };

  function renderRows() {
    if (!flows.length) { $("#rows").innerHTML = `<tr><td colspan="4"><div class="empty">暂无业务场景</div></td></tr>`; return; }
    $("#rows").innerHTML = flows.map((f) => {
      const ruleIds = f.referencedRuleIds || [];
      const meta = STATUS_META[f.status] || STATUS_META[0];
      const active = f.status === 1;
      const pending = pendingFlowIds.has(f.flowId);
      const toggleClass = active ? "is-on" : (f.status === 0 ? "is-draft" : "is-off");
      const actionable = f.status === 0 || f.status === 1;
      const ops = `<button class="open" data-open="${f.flowId}" data-version="${f.version}">${f.status === 0 ? "编排" : "查看"}</button>
        <button class="btn link" data-detail="${f.flowId}" data-version="${f.version}">详情</button>
        <button type="button" class="status-toggle ${toggleClass}${pending ? " is-pending" : ""}" role="switch"
          aria-checked="${active}" aria-label="${esc(f.name)}的发布状态" data-status-toggle="${f.flowId}" data-version="${f.version}"
          ${!actionable || pending ? "disabled" : ""}${pending ? " aria-busy=\"true\"" : ""}>
          <span class="status-toggle-track" aria-hidden="true"><span class="status-toggle-thumb"></span></span>
          <span class="status-toggle-label">${meta.label}</span>
        </button>`;
      return `<tr>
        <td><div class="name">${esc(f.name)}<span class="id">${esc(f.namespace)} / ${esc(f.flowId)} / V${f.version}</span></div><div class="rowdesc">${esc(f.description || "—")}</div></td>
        <td class="num">${ruleIds.length}</td>
        <td class="time">${esc((f.updatedAt || "").slice(5, 16))}</td>
        <td><div class="actions">${ops}</div></td>
      </tr>`;
    }).join("");
  }

  function selectStatus(status) {
    statusFilter = String(status);
    pageNumber = 1;
    document.querySelectorAll("#filters .chip").forEach((chip) => {
      chip.classList.toggle("on", chip.dataset.status === statusFilter);
    });
    loadFlows();
  }

  function openCanvas(id, version) { location.href = Ns.link(`/flow/${id}?version=${version}`); }

  function findFlowVersion(id, version) {
    return flows.find((f) => f.flowId === id && f.version === Number(version));
  }

  function openDrawer(id, version) {
    current = findFlowVersion(id, version);
    if (!current) return;
    drawerOpener = document.activeElement;
    $("#dwName").value = current.name || "";
    $("#dwDesc").value = current.description || "";
    $("#dwVersion").textContent = "v" + current.version;
    $("#dwUpdated").textContent = (current.updatedAt || "").slice(0, 16);
    const ruleIds = current.referencedRuleIds || [];
    $("#dwRuleCount").textContent = ruleIds.length;
    $("#dwNodeCount").textContent = current.nodeCount ?? 0;
    $("#dwRules").innerHTML = ruleIds.length
      ? ruleIds.map((rid) => `<div class="rtag">${esc(ruleNameById.get(String(rid)) || rid)}<span class="rid">#${esc(rid)}</span></div>`).join("")
      : `<span class="hint">未引用任何规则</span>`;
    const editable = current.status === 0;
    $("#dwName").readOnly = !editable;
    $("#dwDesc").readOnly = !editable;
    $("#dwSave").hidden = !editable;
    $("#dwEditHint").textContent = editable ? "当前版本可编辑" : "当前版本只读";
    setDrawerStatus(current.status);
    document.querySelector(".topbar").inert = true;
    document.querySelector(".main").inert = true;
    $("#scrim").classList.add("show"); $("#drawer").classList.add("show");
    requestAnimationFrame(() => $("#dwClose").focus());
  }
  function drawerDirty() {
    return Boolean(current && (
      $("#dwName").value.trim() !== (current.name || "").trim()
      || $("#dwDesc").value.trim() !== (current.description || "").trim()));
  }
  function closeDrawer(force = false) {
    if (!force && drawerDirty() && !window.confirm("详情中有未保存修改，确定关闭吗？")) return false;
    $("#scrim").classList.remove("show"); $("#drawer").classList.remove("show");
    document.querySelector(".topbar").inert = false;
    document.querySelector(".main").inert = false;
    current = null;
    if (drawerOpener && drawerOpener.isConnected) drawerOpener.focus();
    drawerOpener = null;
    return true;
  }
  function setDrawerStatus(v) {
    const meta = STATUS_META[v] || STATUS_META[0];
    const pill = $("#dwStatusPill"); pill.textContent = meta.label; pill.className = "pill " + meta.cls;
  }

  async function saveDrawer(openAfter) {
    if (!current || drawerSaving) return;
    if (current.status !== 0) {
      const { flowId, version } = current;
      closeDrawer(true);
      if (openAfter) openCanvas(flowId, version);
      return;
    }
    const name = $("#dwName").value.trim();
    if (!name) { toast("场景名称不能为空"); return; }
    drawerSaving = true;
    $("#dwSave").disabled = true; $("#dwOpen").disabled = true;
    try {
      await Api.updateFlowMeta(current.flowId, {
        flowId: current.flowId, namespace: current.namespace,
        name, description: $("#dwDesc").value.trim(), version: current.version
      });
      toast("已保存");
      const id = current.flowId;
      const version = current.version;
      closeDrawer(true);
      await loadFlows();
      if (openAfter) openCanvas(id, version);
    } catch (e) { showError(e.message, "保存失败"); }
    finally {
      drawerSaving = false;
      $("#dwSave").disabled = false; $("#dwOpen").disabled = false;
    }
  }

  function openStatusDialog(id, version, button) {
    const f = findFlowVersion(id, version);
    if (!f || ![0, 1].includes(f.status) || pendingFlowIds.has(id)) return;
    const disabling = f.status === 1;
    statusDialogTarget = { id, version: f.version, button };
    $("#statusDlgTitle").textContent = disabling ? "确认停用场景" : "确认发布版本";
    $("#statusDlgMessage").textContent = `${disabling ? "确定停用" : "确定发布"}「${f.name}」V${f.version} 吗？`;
    $("#statusDlgNote").textContent = disabling
      ? "停用后该场景立即退出运行态，但规则树和配置仍会保留。"
      : "发布前会校验并编译当前规则树；成功后该版本成为唯一的当前运行版本，其他草稿继续保留。";
    const confirm = $("#statusConfirm");
    confirm.textContent = disabling ? "确认停用" : "确认发布";
    confirm.className = disabling ? "btn danger" : "btn primary";
    const dialog = $("#statusDlg");
    if (!dialog.open) dialog.showModal();
  }

  function closeStatusDialog() {
    const target = statusDialogTarget;
    statusDialogTarget = null;
    $("#statusDlg").close();
    if (target?.button.isConnected) requestAnimationFrame(() => target.button.focus());
  }

  function confirmStatusChange() {
    const target = statusDialogTarget; if (!target) return;
    statusDialogTarget = null;
    $("#statusDlg").close();
    toggleStatus(target.id, target.version, target.button);
  }

  async function toggleStatus(id, version, button) {
    const f = findFlowVersion(id, version); if (!f) return;
    if (pendingFlowIds.has(id)) return;
    const action = f.status === 1 ? "disable" : "publish";
    pendingFlowIds.add(id);
    button.disabled = true;
    button.classList.add("is-pending");
    button.setAttribute("aria-busy", "true");
    let statusChanged = false;
    try {
      if (action === "disable") {
        await Api.disableFlow(id, f.version);
        toast("已停用");
      } else if (action === "publish") {
        const full = await Api.getFlow(id, f.version);
        await Api.publishFlow(id, {
          flowId: full.flowId, namespace: full.namespace,
          name: full.name, description: full.description,
          ruleTree: full.ruleTree, version: full.version
        });
        toast(`V${f.version} 已发布`);
      }
      statusChanged = true;
      // 清除请求态后再重绘，避免新生成的开关继承旧请求的 pending 状态。
      pendingFlowIds.delete(id);
      await loadFlows();
    } catch (e) { showError(e.message, action === "disable" ? "停用失败" : "发布失败"); }
    finally {
      pendingFlowIds.delete(id);
      if (button.isConnected) {
        button.disabled = false;
        button.classList.remove("is-pending");
        button.removeAttribute("aria-busy");
      } else if (!statusChanged) {
        // 请求期间若筛选/搜索触发过重绘，失败后还原新生成的开关。
        renderRows();
      }
    }
  }

  async function createFlow() {
    const name = $("#newName").value.trim();
    if (!name) { toast("请填写场景名称"); return; }
    try {
      const created = await Api.createFlow({
        name, namespace: Ns.code(), description: $("#newDesc").value.trim(),
        ruleTree: JSON.stringify({
          type: "T", name: "",
          next: { type: "A", name: "", rule: { type: "R", name: "", expr: "∅" } }
        })
      });
      $("#newDlg").close();
      openCanvas(created.flowId, created.version);
    } catch (e) { showError(e.message, "创建失败"); }
  }

  // events
  $("#rows").addEventListener("click", (e) => {
    const o = e.target.closest("[data-open]"); if (o) return openCanvas(o.dataset.open, o.dataset.version);
    const d = e.target.closest("[data-detail]"); if (d) return openDrawer(d.dataset.detail, d.dataset.version);
    const t = e.target.closest("[data-status-toggle]"); if (t) return openStatusDialog(t.dataset.statusToggle, t.dataset.version, t);
  });
  $("#filters").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip"); if (!chip) return;
    selectStatus(chip.dataset.status);
  });
  $("#searchInput").addEventListener("input", Ui.debounce((e) => {
    keyword = e.target.value.trim();
    pageNumber = 1;
    loadFlows();
  }, 250));
  $("#prevPage").addEventListener("click", () => { if (pageNumber > 1) { pageNumber -= 1; loadFlows(); } });
  $("#nextPage").addEventListener("click", () => { if (pageNumber * pageSize < total) { pageNumber += 1; loadFlows(); } });
  $("#dwClose").addEventListener("click", () => closeDrawer());
  $("#dwCancel").addEventListener("click", () => closeDrawer());
  $("#scrim").addEventListener("click", () => closeDrawer());
  $("#dwSave").addEventListener("click", () => saveDrawer(false));
  $("#dwOpen").addEventListener("click", () => saveDrawer(true));
  $("#newFlowBtn").addEventListener("click", () => { $("#newName").value = ""; $("#newDesc").value = ""; $("#newDlg").showModal(); requestAnimationFrame(() => $("#newName").focus()); });
  $("#newCancel").addEventListener("click", () => $("#newDlg").close());
  $("#newCreate").addEventListener("click", createFlow);
  $("#statusCancel").addEventListener("click", closeStatusDialog);
  $("#statusConfirm").addEventListener("click", confirmStatusChange);
  $("#errDlgClose").addEventListener("click", () => $("#errDlg").close());
  $("#statusDlg").addEventListener("cancel", () => {
    const target = statusDialogTarget;
    statusDialogTarget = null;
    if (target?.button.isConnected) requestAnimationFrame(() => target.button.focus());
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && current) closeDrawer(); });

  (async () => {
    const ctx = await Ns.boot();
    if (!ctx) return;
    Ns.mountSelector($("#nsSlot"));
    Ns.applyTabs();
    await Promise.all([loadFlows(), loadReferenceNames()]);
  })();
})();
</script>
</body>
</html>
