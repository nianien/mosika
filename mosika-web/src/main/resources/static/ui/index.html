<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>加载中 · Mosika</title>
    <link rel="icon" type="image/svg+xml" href="/ui/logo.svg">
    <link rel="stylesheet" href="/ui/tokens.css?v=20260811-1">
    <link rel="stylesheet" href="/ui/styles.css?v=20260802-1">
</head>
<body>
<main class="app-shell">
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark"><svg viewBox="0 0 48 48" width="22" height="22" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M24 15V21M14 21H34M14 21V27M34 21V27"/></g><g fill="#fff"><circle cx="24" cy="13" r="3.4"/><circle cx="14" cy="30" r="3.4"/><circle cx="34" cy="30" r="3.4"/></g></svg></span>
            <div>
                <b class="brand-name">Mosika</b>
                <span id="flowCrumbNsWrap" hidden><span class="crumb-sep">/</span><span id="flowCrumbNs" class="crumb-ns"></span></span>
                <span class="crumb-sep">/</span>
                <a class="back-link" id="backToFlows" href="/" title="返回业务场景列表">业务场景</a>
                <span class="crumb-sep">/</span>
                <strong id="flowCrumbName">规则树编辑器</strong>
            </div>
        </div>
        <div class="toolbar" aria-label="画布工具栏">
            <button id="zoomOutButton" type="button" aria-label="缩小">−</button>
            <input id="zoomValue" type="text" inputmode="numeric" value="100%" aria-label="缩放百分比" title="输入缩放百分比后回车">
            <button id="zoomInButton" type="button" aria-label="放大">＋</button>
            <button id="fitButton" type="button">适应画布</button>
        </div>
    </header>

    <section class="workspace">
        <section class="canvas-panel">
            <div class="canvas-titlebar">
                <div>
                    <strong>流程画布</strong>
                    <span id="nodeCount"></span>
                </div>
                <div class="canvas-tools">
                    <button id="collapseAllButton" type="button">折叠全部</button>
                    <button id="expandAllButton" type="button">展开全部</button>
                    <button id="saveDraftButton" type="button">保存草稿</button>
                    <button id="promoteButton" class="primary" type="button">生效</button>
                    <span class="status" id="docStatus"><i></i> <span id="docStatusText">草稿</span></span>
                </div>
            </div>
            <div class="load-error" id="loadErrorBanner" role="alert" hidden>
                <span id="loadErrorText"></span>
                <button id="loadErrorRetry" type="button">重新加载</button>
            </div>
            <div class="tree-viewport" id="treeViewport" tabindex="0" aria-label="可缩放规则树画布">
                <div class="grid"></div>
                <div class="tree-stage" id="treeStage">
                    <div id="treeRoot"></div>
                </div>
            </div>
        </section>

        <button class="inspector-expand" id="inspectorExpand" type="button" aria-label="展开属性栏" title="展开属性栏" hidden>«</button>
        <aside class="inspector" id="inspector">
            <button class="inspector-collapse" id="inspectorCollapse" type="button" aria-label="收起属性栏" title="收起属性栏">»</button>
            <div class="inspector-empty" id="inspectorEmpty">
                <span>↖</span>
                <strong>选择一个节点</strong>
                <p>选择节点后查看结构摘要和可用操作。</p>
            </div>
            <section class="inspector-panel" id="inspectorForm" hidden>
                <div class="inspector-heading rule-editor-heading" id="inspectorHeading"></div>
                <div class="inspector-fields" id="nodeDetailFields"></div>
                <div class="inspector-actions" id="inspectorViewActions">
                    <div class="flow-node-actions" id="flowNodeActions"></div>
                    <button class="flow-operation wide" id="editNodeButton" type="button" hidden>查看规则</button>
                </div>
                <div class="inspector-add" id="inspectorAddPanel" hidden>
                    <div class="inspector-add-title" id="inspectorAddTitle">添加节点</div>
                    <label class="detail-field">
                        <span class="detail-label">节点类型</span>
                        <select id="newNodeType"></select>
                    </label>
                    <div class="inspector-actions">
                        <button id="newNodeCancelButton" type="button">取消</button>
                        <button class="primary" id="confirmAddButton" type="button">添加</button>
                    </div>
                </div>
                <div class="inspector-footer" id="inspectorFooter">
                    <button class="inspector-delete" id="deleteButton" type="button">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M9 3h6m-9 4h12m-1 0-.7 13H7.7L7 7m3 4v5m4-5v5"/>
                        </svg>
                        删除节点
                    </button>
                </div>
            </section>
        </aside>
    </section>
</main>

<dialog id="confirmDialog">
    <form method="dialog" id="confirmDialogForm">
        <div class="dialog-heading">
            <div>
                <h2 id="confirmDialogTitle">确认操作</h2>
            </div>
            <button class="icon-button" value="cancel" aria-label="关闭" type="submit">×</button>
        </div>
        <p class="confirm-message" id="confirmDialogMessage"></p>
        <div class="dialog-actions">
            <button value="cancel" type="submit">取消</button>
            <button class="danger" id="confirmDialogConfirm" value="default" type="submit">确定</button>
        </div>
    </form>
</dialog>

<dialog id="nodeConfigDialog">
    <form method="dialog" class="node-config-form">
        <div class="dialog-heading">
            <div>
                <span>选择节点类型并完成配置</span>
                <h2>配置节点</h2>
            </div>
            <button class="icon-button" id="nodeConfigCloseButton" aria-label="关闭" type="button">×</button>
        </div>
        <label class="detail-field" id="nodeConfigTypeField">
            <span class="detail-label">节点类型</span>
            <select id="nodeConfigType">
                <option value="A">动作节点</option>
                <option value="C">条件节点</option>
                <option value="S">串行节点</option>
                <option value="P">并行节点</option>
                <option value="D">分支节点</option>
            </select>
        </label>
        <label class="detail-field" id="nodeConfigRuleField">
            <span class="detail-label">引用规则</span>
            <select id="nodeConfigRule"></select>
        </label>
        <p class="form-note" id="nodeConfigNote"></p>
        <div class="dialog-actions">
            <button id="nodeConfigCancelButton" type="button">取消</button>
            <button class="primary" id="nodeConfigConfirmButton" type="button">确认</button>
        </div>
    </form>
</dialog>

<dialog id="validateDialog">
    <div class="dialog-heading">
        <div>
            <h2>结构校验</h2>
        </div>
        <button class="icon-button" id="validateCloseButton" aria-label="关闭" type="button">×</button>
    </div>
    <p class="confirm-message" id="validateSummary"></p>
    <ul class="validate-list" id="validateList"></ul>
    <div class="dialog-actions">
        <button id="validateDismissButton" type="button">关闭</button>
    </div>
</dialog>

<dialog id="ruleDialog" class="rule-dialog">
    <div class="rule-dialog-shell">
        <header class="rule-dialog-header">
            <div>
                <span>条件配置</span>
                <h2 id="ruleDialogTitle">判断条件</h2>
            </div>
            <div class="rule-dialog-header-actions">
                <button id="ruleDialogCancelButton" type="button">取消</button>
                <button class="primary" id="ruleDialogCloseButton" type="button">保存</button>
            </div>
        </header>
        <div class="rule-dialog-body">
            <section class="rule-tree-panel" id="ruleTreePanel" aria-label="规则树">
                <div class="rule-tree-caption">
                    <strong>条件组合</strong>
                    <span id="ruleNodeCount"></span>
                </div>
                <div class="rule-tree-viewport">
                    <div id="ruleTreeRoot"></div>
                </div>
            </section>
            <aside class="rule-editor">
                <div class="rule-editor-empty" id="ruleEditorEmpty">
                    <span>◇</span>
                    <strong id="ruleEditorEmptyTitle">尚未配置条件</strong>
                    <p id="ruleEditorEmptyHint">规则子树只在当前弹窗内递归，不会进入流程画布。</p>
                </div>
                <div class="rule-editor-panel" id="ruleEditorPanel" hidden>
                    <div class="inspector-heading rule-editor-heading" id="ruleEditorHeading"></div>
                    <div class="detail-field" id="ruleEditorLogicField" data-field="rulelogic" hidden></div>
                    <div class="detail-field rule-negate-field" id="ruleNegateField" hidden>
                        <span class="detail-label">取反</span>
                        <label class="rule-negate-row">
                            <span class="switch">
                                <input type="checkbox" id="ruleNegateInput">
                                <span class="switch-track"></span>
                            </span>
                        </label>
                    </div>
                    <div class="rule-subrules-field" id="ruleEditorSubrulesField">
                        <span class="detail-label" id="ruleEditorSubrulesLabel">规则</span>
                        <div class="rule-add-rows" id="ruleEditorSubrules"></div>
                        <button class="rule-add-row-button" id="ruleEditorAddRuleButton" type="button" hidden>＋ 添加规则</button>
                    </div>
                    <label id="ruleReferenceField" hidden>
                        <span id="ruleReferenceLabel">命中表达式</span>
                        <input id="ruleNodeExpression" readonly>
                    </label>
                    <div class="rule-editor-params" id="ruleEditorParamsField" hidden></div>
                    <div class="inspector-add" id="ruleAddPanel" hidden>
                        <div class="inspector-add-title" id="ruleAddTitle">添加规则</div>
                        <div class="rule-add-rows" id="ruleAddRows"></div>
                        <button class="rule-add-row-button" id="ruleAddRowButton" type="button">＋ 添加规则</button>
                        <fieldset class="rule-logic-field" id="ruleAddLogicField" hidden>
                            <legend>组合方式</legend>
                            <div class="rule-radio-group">
                                <label>
                                    <input type="radio" name="ruleAddLogic" value="&amp;&amp;" checked>
                                    <span>与</span>
                                </label>
                                <label>
                                    <input type="radio" name="ruleAddLogic" value="||">
                                    <span>或</span>
                                </label>
                            </div>
                        </fieldset>
                        <div class="inspector-actions">
                            <button id="ruleAddCancelButton" type="button">取消</button>
                            <button class="primary" id="ruleAddConfirmButton" type="button">确认添加</button>
                        </div>
                    </div>
                    <div class="inspector-footer" id="ruleEditorFooter">
                        <button class="inspector-delete" id="ruleEditorDeleteButton" type="button">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M9 3h6m-9 4h12m-1 0-.7 13H7.7L7 7m3 4v5m4-5v5"/>
                            </svg>
                            删除规则
                        </button>
                    </div>
                </div>
            </aside>
        </div>
    </div>
</dialog>

<dialog id="ruleAddDialog">
    <form method="dialog" class="rule-add-form">
        <div class="dialog-heading">
            <h2>添加规则</h2>
            <button class="icon-button" value="cancel" type="submit" aria-label="关闭">×</button>
        </div>
        <div class="rule-add-rows" id="ruleCompositeRows"></div>
        <button class="rule-add-row-button" id="ruleCompositeAddRow" type="button" aria-label="添加一条规则">＋</button>
        <fieldset class="rule-logic-field" id="ruleCompositeLogicField" hidden>
            <legend>组合方式</legend>
            <div class="rule-radio-group">
                <label><input type="radio" name="ruleCompositeLogic" value="&&" checked><span>与</span></label>
                <label><input type="radio" name="ruleCompositeLogic" value="||"><span>或</span></label>
            </div>
        </fieldset>
        <div class="dialog-actions">
            <button value="cancel" type="submit">取消</button>
            <button class="primary" id="ruleCompositeConfirmButton" type="button">确认</button>
        </div>
    </form>
</dialog>

<div id="nodeContextMenu" class="context-menu" hidden role="menu"></div>

<script src="/ui/treenode.js?v=20260810-1"></script>
<script src="/ui/api.js?v=20260810-1"></script>
<script src="/ui/ns.js?v=20260810-1"></script>
<script src="/ui/app.js?v=20260810-1"></script>
</body>
</html>
