server:
  port: 8080
  # 默认仅本机访问；需要局域网部署时必须显式设置地址并在外层补充认证与访问控制。
  address: ${MOSIKA_SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: mosika-web
  datasource:
    driver-class-name: org.sqlite.JDBC
    # WAL 提升读并发；busy_timeout 缓解写锁；DB 文件默认归属 mosika-web 模块
    url: jdbc:sqlite:${mosika.db.path:./mosika-web/data/mosika.db}?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    hikari:
      # SQLite 单写模型，池设为 1 避免写锁竞争
      maximum-pool-size: 1
      minimum-idle: 1
      pool-name: mosika-sqlite
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  jackson:
    default-property-inclusion: non_null

mosika:
  db:
    path: ./mosika-web/data/mosika.db

logging:
  level:
    root: INFO
    com.nianien.mosika: DEBUG
