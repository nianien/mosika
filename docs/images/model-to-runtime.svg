<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 640" role="img" aria-labelledby="title desc">
    <title id="title">Mosika 一次建模，全链路一致</title>
    <desc id="desc">规则创作经过统一语义内核编译为运行快照，再连接插件、本地执行、远程执行、追踪和实时回放</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
        </marker>
        <style>
            .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 7; }
            .input { fill: #f0fdfa; stroke: #14b8a6; stroke-width: 2.5; }
            .core { fill: #ecfeff; stroke: #0891b2; stroke-width: 2.5; }
            .output { fill: #fff7ed; stroke: #f59e0b; stroke-width: 2.5; }
            .edge { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
            .group-title { fill: #0f172a; font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
            .group-subtitle { fill: #64748b; font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .14em; }
            .node-title { fill: #0f172a; font: 650 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; text-anchor: middle; dominant-baseline: central; }
            .node-subtitle { fill: #475569; font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; text-anchor: middle; }
            .edge-label { fill: #475569; font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
        </style>
    </defs>

    <rect class="group" x="30" y="38" width="290" height="530" rx="20"/>
    <rect class="group" x="350" y="38" width="760" height="530" rx="20"/>
    <rect class="group" x="1140" y="38" width="630" height="530" rx="20"/>

    <text class="group-title" x="58" y="78">规则创作</text>
    <text class="group-subtitle" x="58" y="101">AUTHORING</text>
    <text class="group-title" x="378" y="78">统一语义内核</text>
    <text class="group-subtitle" x="378" y="101">KERNEL</text>
    <text class="group-title" x="1168" y="78">执行生态</text>
    <text class="group-subtitle" x="1168" y="101">ECOSYSTEM</text>

    <path class="edge" d="M 280 210 H 380"/>
    <path class="edge" d="M 280 395 C 405 395 445 245 560 215"/>
    <path class="edge" d="M 535 210 H 560"/>
    <path class="edge" d="M 720 210 H 745"/>
    <path class="edge" d="M 905 210 H 930"/>
    <path class="edge" d="M 1080 210 C 1120 210 1150 170 1190 170"/>
    <path class="edge" d="M 1080 210 C 1120 210 1150 285 1190 285"/>
    <path class="edge" d="M 1080 210 C 1120 210 1150 400 1190 400"/>
    <path class="edge" d="M 1380 400 H 1470"/>
    <path class="edge" d="M 1580 135 V 115 H 825 V 175"/>

    <text class="edge-label" x="330" y="199">建模</text>
    <text class="edge-label" x="430" y="353">测试</text>
    <text class="edge-label" x="825" y="112">注册</text>
    <text class="edge-label" x="1425" y="390">事件</text>

    <rect class="input" x="60" y="175" width="220" height="70" rx="14"/>
    <text class="node-title" x="170" y="210">拖拽编辑</text>
    <rect class="input" x="60" y="360" width="220" height="70" rx="14"/>
    <text class="node-title" x="170" y="395">在线编译与测试</text>

    <rect class="core" x="380" y="175" width="155" height="70" rx="14"/>
    <text class="node-title" x="457.5" y="202">UI AST / DSL</text>
    <text class="node-subtitle" x="457.5" y="227">统一模型</text>
    <rect class="core" x="560" y="175" width="160" height="70" rx="14"/>
    <text class="node-title" x="640" y="202">校验与编译</text>
    <text class="node-subtitle" x="640" y="227">递归解析</text>
    <rect class="core" x="745" y="175" width="160" height="70" rx="14"/>
    <text class="node-title" x="825" y="202">RuleSuite</text>
    <text class="node-subtitle" x="825" y="227">运行快照</text>
    <rect class="core" x="930" y="175" width="150" height="70" rx="14"/>
    <text class="node-title" x="1005" y="202">RuleVisitor</text>
    <text class="node-subtitle" x="1005" y="227">RuleNode</text>

    <rect class="output" x="1190" y="135" width="190" height="70" rx="14"/>
    <text class="node-title" x="1285" y="170">本地执行</text>
    <rect class="output" x="1190" y="250" width="190" height="70" rx="14"/>
    <text class="node-title" x="1285" y="285">远程执行</text>
    <rect class="output" x="1190" y="365" width="190" height="70" rx="14"/>
    <text class="node-title" x="1285" y="400">追踪</text>
    <rect class="output" x="1470" y="365" width="220" height="70" rx="14"/>
    <text class="node-title" x="1580" y="400">实时回放</text>
    <rect class="output" x="1470" y="135" width="220" height="70" rx="14"/>
    <text class="node-title" x="1580" y="162">插件 / UDF</text>
    <text class="node-subtitle" x="1580" y="187">扩展能力</text>

    <text class="node-subtitle" x="900" y="610">同一棵语义树贯穿编辑、编译、执行、追踪与回放</text>
</svg>
