<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-labelledby="title desc">
    <title id="title">条件执行</title>
    <desc id="desc">判断规则 a，命中时执行 b，否则执行 c，随后继续执行 d</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
        </marker>
        <style>
            .edge { fill: none; stroke: #475569; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
            .node { fill: #f0fdfa; stroke: #14b8a6; stroke-width: 3; }
            .label { fill: #0f172a; font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; }
            .branch { fill: #0f766e; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; paint-order: stroke; stroke: white; stroke-width: 7px; stroke-linejoin: round; }
        </style>
    </defs>
    <path class="edge" d="M 74 120 C 158 120, 186 42, 274 42"/>
    <path class="edge" d="M 74 120 C 158 120, 186 198, 274 198"/>
    <path class="edge" d="M 324 42 C 412 42, 438 120, 524 120"/>
    <path class="edge" d="M 324 198 C 412 198, 438 120, 524 120"/>
    <text class="branch" x="165" y="71">Y</text>
    <text class="branch" x="165" y="184">N</text>
    <circle class="node" cx="50" cy="120" r="22"/>
    <circle class="node" cx="300" cy="42" r="22"/>
    <circle class="node" cx="300" cy="198" r="22"/>
    <circle class="node" cx="550" cy="120" r="22"/>
    <text class="label" x="50" y="120">a</text>
    <text class="label" x="300" y="42">b</text>
    <text class="label" x="300" y="198">c</text>
    <text class="label" x="550" y="120">d</text>
</svg>
