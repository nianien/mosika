<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 430" role="img" aria-labelledby="title desc">
    <title id="title">Mosika 从定义到执行</title>
    <desc id="desc">原子规则和 UDF 注册到 RuleEngine，复合规则与 RuleEngine 共同构建 RuleSuite，再生成 RuleNode 并得到 NodeResult</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
        </marker>
        <style>
            .source { fill: #f0fdfa; stroke: #14b8a6; stroke-width: 2.5; }
            .engine { fill: #ecfeff; stroke: #0891b2; stroke-width: 2.5; }
            .result { fill: #fff7ed; stroke: #f59e0b; stroke-width: 2.5; }
            .edge { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
            .node-title { fill: #0f172a; font: 650 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; text-anchor: middle; }
            .node-subtitle { fill: #475569; font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; text-anchor: middle; }
            .edge-label { fill: #475569; font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
        </style>
    </defs>

    <path class="edge" d="M 300 100 H 390"/>
    <path class="edge" d="M 300 335 C 340 335 350 120 390 100"/>
    <path class="edge" d="M 610 100 C 665 100 675 215 730 215"/>
    <path class="edge" d="M 300 215 H 730"/>
    <path class="edge" d="M 950 215 H 1050"/>
    <path class="edge" d="M 1270 215 H 1360"/>

    <text class="edge-label" x="345" y="89">注册</text>
    <text class="edge-label" x="518" y="204">编译</text>
    <text class="edge-label" x="1000" y="204">生成</text>
    <text class="edge-label" x="1315" y="204">执行</text>

    <rect class="source" x="40" y="60" width="260" height="80" rx="14"/>
    <text class="node-title" x="170" y="92">RuleDefinition</text>
    <text class="node-subtitle" x="170" y="117">原子规则 / JavaScript</text>
    <rect class="source" x="40" y="175" width="260" height="80" rx="14"/>
    <text class="node-title" x="170" y="207">RuleDefinition</text>
    <text class="node-subtitle" x="170" y="232">复合规则 / ID DSL</text>
    <rect class="source" x="40" y="295" width="260" height="80" rx="14"/>
    <text class="node-title" x="170" y="327">UdfDefinition</text>
    <text class="node-subtitle" x="170" y="352">Java / JavaScript UDF</text>

    <rect class="engine" x="390" y="60" width="220" height="80" rx="14"/>
    <text class="node-title" x="500" y="92">RuleEngine</text>
    <text class="node-subtitle" x="500" y="117">注册与预编译</text>
    <rect class="engine" x="730" y="175" width="220" height="80" rx="14"/>
    <text class="node-title" x="840" y="207">RuleSuite</text>
    <text class="node-subtitle" x="840" y="232">可执行套件</text>
    <rect class="engine" x="1050" y="175" width="220" height="80" rx="14"/>
    <text class="node-title" x="1160" y="207">RuleNode</text>
    <text class="node-subtitle" x="1160" y="232">递归执行树</text>
    <rect class="result" x="1360" y="175" width="200" height="80" rx="14"/>
    <text class="node-title" x="1460" y="207">NodeResult</text>
    <text class="node-subtitle" x="1460" y="232">结果与详情</text>
</svg>
