<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title desc">
    <title id="title">有序多分支决策</title>
    <desc id="desc">依次判断规则 a 和 c，命中首个后执行对应动作，否则执行默认动作 e</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
        </marker>
        <style>
            .edge { fill: none; stroke: #475569; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
            .node { fill: #f0fdfa; stroke: #14b8a6; stroke-width: 3; }
            .structure { fill: #ecfeff; stroke: #0891b2; stroke-width: 3; }
            .label { fill: #0f172a; font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; }
            .branch { fill: #0f766e; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; paint-order: stroke; stroke: white; stroke-width: 7px; stroke-linejoin: round; }
        </style>
    </defs>
    <path class="edge" d="M 76 150 C 154 150, 170 45, 234 45"/>
    <path class="edge" d="M 76 150 H 234"/>
    <path class="edge" d="M 76 150 C 154 150, 170 255, 234 255"/>
    <path class="edge" d="M 286 45 H 494"/>
    <path class="edge" d="M 286 150 H 494"/>
    <text class="branch" x="388" y="34">命中</text>
    <text class="branch" x="388" y="139">命中</text>
    <text class="branch" x="160" y="278">默认</text>
    <circle class="structure" cx="52" cy="150" r="22"/>
    <circle class="node" cx="260" cy="45" r="22"/>
    <circle class="node" cx="520" cy="45" r="22"/>
    <circle class="node" cx="260" cy="150" r="22"/>
    <circle class="node" cx="520" cy="150" r="22"/>
    <circle class="node" cx="260" cy="255" r="22"/>
    <text class="label" x="52" y="150">分</text>
    <text class="label" x="260" y="45">a</text>
    <text class="label" x="520" y="45">b</text>
    <text class="label" x="260" y="150">c</text>
    <text class="label" x="520" y="150">d</text>
    <text class="label" x="260" y="255">e</text>
</svg>
