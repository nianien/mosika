<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
    <title id="title">有界循环</title>
    <desc id="desc">每轮判断条件 c，命中则执行动作 a 并进入下一轮；条件未命中，或动作后轮数达到上限，都结束循环继续往下执行</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
        </marker>
        <style>
            .edge { fill: none; stroke: #475569; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
            .node { fill: #f0fdfa; stroke: #14b8a6; stroke-width: 3; }
            .label { fill: #0f172a; font: 600 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; }
            .branch { fill: #0f766e; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; paint-order: stroke; stroke: white; stroke-width: 7px; stroke-linejoin: round; text-anchor: middle; }
        </style>
    </defs>
    <path class="edge" d="M 400 98 C 400 44, 200 44, 200 98"/>
    <path class="edge" d="M 222 120 L 378 120"/>
    <path class="edge" d="M 186 138 C 152 176, 122 202, 110 230"/>
    <path class="edge" d="M 414 138 C 448 176, 478 202, 490 230"/>
    <text class="branch" x="300" y="44">下一轮 · 最多 3 轮</text>
    <text class="branch" x="300" y="102">命中</text>
    <text class="branch" x="96" y="205">未命中</text>
    <text class="branch" x="504" y="205">达上限</text>
    <circle class="node" cx="200" cy="120" r="22"/>
    <circle class="node" cx="400" cy="120" r="22"/>
    <text class="label" x="200" y="120">c</text>
    <text class="label" x="400" y="120">a</text>
    <text class="branch" x="300" y="250">结束循环，继续往下执行</text>
</svg>
