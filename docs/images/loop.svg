<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" role="img" aria-labelledby="title desc">
    <title id="title">有界循环</title>
    <desc id="desc">循环节点在轮次小于 3 时判断条件，条件命中则执行动作，随后进入下一轮</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
        </marker>
        <style>
            .edge { fill: none; stroke: #475569; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
            .node { fill: #f0fdfa; stroke: #14b8a6; stroke-width: 3; }
            .label { fill: #0f172a; font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; }
            .branch { fill: #0f766e; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; paint-order: stroke; stroke: white; stroke-width: 7px; stroke-linejoin: round; text-anchor: middle; }
        </style>
    </defs>
    <path class="edge" d="M 522 98 C 470 46, 180 46, 108 88"/>
    <path class="edge" d="M 132 122 L 290 122"/>
    <path class="edge" d="M 368 122 L 498 122"/>
    <text class="branch" x="212" y="104">轮次 &lt; 3</text>
    <text class="branch" x="433" y="104">命中</text>
    <text class="branch" x="320" y="40">下一轮</text>
    <rect class="node" x="68" y="100" width="64" height="44" rx="14"/>
    <rect class="node" x="292" y="100" width="76" height="44" rx="14"/>
    <rect class="node" x="500" y="100" width="76" height="44" rx="14"/>
    <text class="label" x="100" y="123">循</text>
    <text class="label" x="330" y="123">条件</text>
    <text class="label" x="538" y="123">动作</text>
</svg>
