<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" role="img" aria-labelledby="title desc">
    <title id="title">有界循环</title>
    <desc id="desc">循环节点在未达最大轮次时判断条件，条件命中则执行动作，随后进入下一轮，最多 3 轮</desc>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
        </marker>
        <style>
            .edge { fill: none; stroke: #475569; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
            .node { fill: #f0fdfa; stroke: #14b8a6; stroke-width: 3; }
            .label { fill: #0f172a; font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; dominant-baseline: central; }
            .branch { fill: #0f766e; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; paint-order: stroke; stroke: white; stroke-width: 7px; stroke-linejoin: round; text-anchor: middle; }
        </style>
    </defs>
    <path class="edge" d="M 540 94 C 540 38, 100 38, 100 94"/>
    <path class="edge" d="M 134 118 L 290 118"/>
    <path class="edge" d="M 370 118 L 498 118"/>
    <text class="branch" x="212" y="100">未达最大轮次</text>
    <text class="branch" x="434" y="100">命中</text>
    <text class="branch" x="320" y="34">下一轮 · 最多 3 轮</text>
    <rect class="node" x="68" y="96" width="64" height="44" rx="14"/>
    <rect class="node" x="292" y="96" width="76" height="44" rx="14"/>
    <rect class="node" x="500" y="96" width="76" height="44" rx="14"/>
    <text class="label" x="100" y="119">循</text>
    <text class="label" x="330" y="119">条件</text>
    <text class="label" x="538" y="119">动作</text>
</svg>
