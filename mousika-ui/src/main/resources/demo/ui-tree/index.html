<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>Mousika 规则树编辑器</title>
    <link rel="stylesheet" href="styles.css?v=20260724-101">
</head>
<body>
<main class="app-shell">
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark">M</span>
            <div>
                <strong>规则树编辑器</strong>
                <span>递归 DSL 布局原型</span>
            </div>
        </div>
        <div class="toolbar" aria-label="画布工具栏">
            <button id="zoomOutButton" type="button" aria-label="缩小">−</button>
            <output id="zoomValue">100%</output>
            <button id="zoomInButton" type="button" aria-label="放大">＋</button>
            <button id="fitButton" type="button">适应画布</button>
            <button id="resetButton" type="button">重置示例</button>
        </div>
    </header>

    <section class="workspace">
        <aside class="legend" aria-label="节点图例">
            <h2>节点</h2>
            <div class="legend-item"><span class="legend-shape root">根</span><span>根节点</span></div>
            <div class="legend-item"><span class="legend-shape structure">并</span><span>并行节点</span></div>
            <div class="legend-item"><span class="legend-shape structure">串</span><span>串行节点</span></div>
            <div class="legend-item"><span class="legend-shape structure">分</span><span>分支节点</span></div>
            <div class="legend-item"><span class="legend-shape condition">条件</span><span>条件节点</span></div>
            <div class="legend-item"><span class="legend-shape action">动作</span><span>动作节点</span></div>
            <p>拖动画布移动<br>滚轮平移<br>⌘/Ctrl + 滚轮缩放</p>
        </aside>

        <section class="canvas-panel">
            <div class="canvas-titlebar">
                <div>
                    <strong>UI 树示例</strong>
                    <span id="nodeCount"></span>
                </div>
                <span class="status"><i></i> 本地草稿</span>
            </div>
            <div class="tree-viewport" id="treeViewport" tabindex="0" aria-label="可缩放规则树画布">
                <div class="grid"></div>
                <div class="tree-stage" id="treeStage">
                    <div id="treeRoot"></div>
                </div>
                <div class="canvas-hint" id="canvasHint">单击选中节点 · 在右侧栏查看和操作 · 节点下方按钮用于折叠或展开</div>
            </div>
        </section>

        <aside class="inspector" id="inspector">
            <div class="inspector-empty" id="inspectorEmpty">
                <span>↖</span>
                <strong>选择一个节点</strong>
                <p>选择节点后查看结构摘要和可用操作。</p>
            </div>
            <section class="inspector-panel" id="inspectorForm" hidden>
                <div class="inspector-heading rule-editor-heading" id="inspectorHeading"></div>
                <div class="inspector-fields" id="nodeDetailFields"></div>
                <div class="inspector-actions" id="inspectorViewActions">
                    <div class="flow-node-actions" id="flowNodeActions"></div>
                    <button class="flow-operation wide" id="editNodeButton" type="button" hidden>查看规则</button>
                </div>
                <div class="inspector-add" id="inspectorAddPanel" hidden>
                    <div class="inspector-add-title" id="inspectorAddTitle">添加节点</div>
                    <label class="detail-field">
                        <span class="detail-label">节点类型</span>
                        <select id="newNodeType"></select>
                    </label>
                    <label class="detail-field" id="newNodeDefinitionField">
                        <span class="detail-label">引用规则</span>
                        <select id="newNodeDefinition"></select>
                    </label>
                    <label class="detail-field" id="newNodePlacementField">
                        <span class="detail-label">添加位置</span>
                        <select id="newNodePlacement">
                            <option value="first">最前面</option>
                            <option value="last" selected>最后面</option>
                            <option value="before">节点之前</option>
                            <option value="after">节点之后</option>
                        </select>
                    </label>
                    <label class="detail-field" id="newNodeAnchorField">
                        <span class="detail-label">选择参照节点</span>
                        <select id="newNodeAnchor"></select>
                    </label>
                    <div class="inspector-actions">
                        <button id="newNodeCancelButton" type="button">取消</button>
                        <button class="primary" id="confirmAddButton" type="button">添加</button>
                    </div>
                </div>
                <div class="inspector-footer" id="inspectorFooter">
                    <button class="inspector-delete" id="deleteButton" type="button">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M9 3h6m-9 4h12m-1 0-.7 13H7.7L7 7m3 4v5m4-5v5"/>
                        </svg>
                        删除节点
                    </button>
                </div>
            </section>
        </aside>
    </section>
</main>

<dialog id="confirmDialog">
    <form method="dialog" id="confirmDialogForm">
        <div class="dialog-heading">
            <div>
                <h2 id="confirmDialogTitle">确认操作</h2>
            </div>
            <button class="icon-button" value="cancel" aria-label="关闭" type="submit">×</button>
        </div>
        <p class="confirm-message" id="confirmDialogMessage"></p>
        <div class="dialog-actions">
            <button value="cancel" type="submit">取消</button>
            <button class="danger" id="confirmDialogConfirm" value="default" type="submit">确定</button>
        </div>
    </form>
</dialog>

<dialog id="ruleDialog" class="rule-dialog">
    <div class="rule-dialog-shell">
        <header class="rule-dialog-header">
            <div>
                <span>条件配置</span>
                <h2 id="ruleDialogTitle">判断条件</h2>
            </div>
            <button class="icon-button" id="ruleDialogCloseButton" aria-label="关闭" type="button">×</button>
        </header>
        <div class="rule-dialog-body">
            <section class="rule-tree-panel" id="ruleTreePanel" aria-label="规则树">
                <div class="rule-tree-caption">
                    <strong>条件组合</strong>
                    <span id="ruleNodeCount"></span>
                </div>
                <div class="rule-tree-viewport">
                    <div id="ruleTreeRoot"></div>
                </div>
            </section>
            <aside class="rule-editor">
                <div class="rule-editor-empty" id="ruleEditorEmpty">
                    <span>◇</span>
                    <strong id="ruleEditorEmptyTitle">尚未配置条件</strong>
                    <p id="ruleEditorEmptyHint">规则子树只在当前弹窗内递归，不会进入流程画布。</p>
                </div>
                <div class="rule-editor-panel" id="ruleEditorPanel" hidden>
                    <div class="inspector-heading rule-editor-heading" id="ruleEditorHeading"></div>
                    <div class="rule-subrules-field" id="ruleEditorSubrulesField">
                        <span class="detail-label" id="ruleEditorSubrulesLabel">规则</span>
                        <div class="rule-add-rows" id="ruleEditorSubrules"></div>
                        <button class="rule-add-row-button" id="ruleEditorAddRuleButton" type="button" hidden>＋ 添加规则</button>
                    </div>
                    <fieldset class="rule-logic-field" id="ruleEditorLogicField" hidden>
                        <legend>组合方式</legend>
                        <div class="rule-radio-group">
                            <label>
                                <input type="radio" name="ruleEditorLogic" value="&amp;&amp;" checked>
                                <span>与</span>
                            </label>
                            <label>
                                <input type="radio" name="ruleEditorLogic" value="||">
                                <span>或</span>
                            </label>
                        </div>
                    </fieldset>
                    <label id="ruleReferenceField" hidden>
                        <span id="ruleReferenceLabel">命中表达式</span>
                        <input id="ruleNodeExpression" readonly>
                    </label>
                    <div class="rule-editor-actions" id="ruleEditorEditActions" hidden>
                        <button id="ruleEditorCancelButton" type="button">取消</button>
                        <button class="primary" id="ruleEditorSaveButton" type="button" disabled>保存</button>
                    </div>
                    <div class="rule-editor-actions" id="ruleEditorViewActions">
                        <button class="flow-operation wide" type="button" data-rule-action="edit">编辑</button>
                        <button class="flow-operation wide" id="ruleViewBefore" type="button" data-rule-action="before">上方插入</button>
                        <button class="flow-operation wide" id="ruleViewAfter" type="button" data-rule-action="after">下方插入</button>
                    </div>
                    <div class="inspector-add" id="ruleAddPanel" hidden>
                        <div class="inspector-add-title" id="ruleAddTitle">添加规则</div>
                        <div class="rule-add-rows" id="ruleAddRows"></div>
                        <button class="rule-add-row-button" id="ruleAddRowButton" type="button">＋ 添加规则</button>
                        <fieldset class="rule-logic-field" id="ruleAddLogicField" hidden>
                            <legend>组合方式</legend>
                            <div class="rule-radio-group">
                                <label>
                                    <input type="radio" name="ruleAddLogic" value="&amp;&amp;" checked>
                                    <span>与</span>
                                </label>
                                <label>
                                    <input type="radio" name="ruleAddLogic" value="||">
                                    <span>或</span>
                                </label>
                            </div>
                        </fieldset>
                        <div class="inspector-actions">
                            <button id="ruleAddCancelButton" type="button">取消</button>
                            <button class="primary" id="ruleAddConfirmButton" type="button">确认添加</button>
                        </div>
                    </div>
                    <div class="inspector-footer" id="ruleEditorFooter">
                        <button class="inspector-delete" id="ruleEditorDeleteButton" type="button">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M9 3h6m-9 4h12m-1 0-.7 13H7.7L7 7m3 4v5m4-5v5"/>
                            </svg>
                            删除规则
                        </button>
                    </div>
                </div>
            </aside>
        </div>
    </div>
</dialog>

<script src="app.js?v=20260724-101"></script>
</body>
</html>
