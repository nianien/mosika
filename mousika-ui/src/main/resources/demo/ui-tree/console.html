<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>业务场景 · Mousika 规则编排</title>
<style>
:root{
  color-scheme:light;
  font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:#123038;background:#edf4f3;
  --teal:#0f9d8a;--teal-d:#0c8477;--teal-soft:#dff5f1;
  --cyan:#0891b2;--cyan-soft:#e3fafd;
  --green:#1f7a43;--green-soft:#dcf9e4;
  --lemon:#8a6d0e;--lemon-soft:#fdf6d5;
  --grey:#7b8aa5;--grey-soft:#eef1f6;--border:#cfe3e0;
}
*{box-sizing:border-box;margin:0;padding:0}
.app-shell{height:100vh;display:grid;grid-template-rows:58px minmax(0,1fr);position:relative}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 22px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.96);box-shadow:0 2px 12px rgba(20,80,72,.05);}
.brandwrap{display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:#fff;font-weight:800;background:linear-gradient(145deg,#2fd6c6,#0f9d8a);box-shadow:0 5px 12px rgba(15,157,138,.32)}
.brand b{font-size:15px}.brand small{display:block;color:#6f8b86;font-size:11.5px;margin-top:1px}
.tabs{display:flex;gap:6px;margin-left:26px}
.tab{height:32px;padding:0 14px;border-radius:8px;font-size:13px;color:#5c766f;display:flex;align-items:center;cursor:pointer;text-decoration:none}
.tab.on{background:var(--teal-soft);color:var(--teal-d);font-weight:600}
.top-right{display:flex;align-items:center;gap:12px}
.search{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:#fff}
.search input{border:none;outline:none;font-size:13px;width:200px;background:transparent;color:#123038}
.btn{height:34px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:#fff;color:#2c5049;font-size:13px;cursor:pointer}
.btn:hover{border-color:#a9d3cc;background:#f5faf9}
.btn.primary{color:#fff;border-color:var(--teal);background:var(--teal);font-weight:600}
.btn.primary:hover{background:var(--teal-d)}
.btn.link{border:none;background:none;color:var(--teal-d);padding:0 6px;height:auto;cursor:pointer}
.btn.link.danger{color:#c9504f}
.main{overflow:auto;padding:22px 26px}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-head h1{font-size:19px}.page-head .sub{color:#6f8b86;font-size:13px;margin-left:10px;font-weight:400}
.filters{display:flex;gap:8px}
.chip{height:30px;padding:0 14px;border-radius:16px;border:1px solid var(--border);background:#fff;color:#54706a;font-size:12.5px;display:flex;align-items:center;cursor:pointer}
.chip.on{background:var(--teal-soft);border-color:#9fd8cf;color:var(--teal-d);font-weight:600}
.panel{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(20,80,72,.05)}
table{width:100%;border-collapse:collapse;font-size:13.2px}
thead th{text-align:left;padding:13px 18px;color:#6f8b86;font-weight:600;font-size:12.5px;background:#f4faf9;border-bottom:1px solid var(--border)}
tbody td{padding:15px 18px;border-bottom:1px solid #eef4f2;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#f7fcfb}
.name{font-weight:600;font-size:14px}
.name .id{color:#9fb4af;font-weight:400;font-size:11.5px;margin-left:7px}
.rowdesc{color:#71887f;font-size:12.3px;margin-top:3px;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:11px;white-space:nowrap}
.pill.live{color:var(--green);background:var(--green-soft)}
.pill.off{color:var(--grey);background:var(--grey-soft)}
.num{font-variant-numeric:tabular-nums;color:#3f5f58}
.time{color:#8aa39d;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:4px;align-items:center;justify-content:flex-end;white-space:nowrap}
.actions .open{appearance:none;box-shadow:none;color:var(--teal-d);background:var(--teal-soft);border:1px solid #9fd8cf;border-radius:7px;height:28px;padding:0 12px;font-weight:600;font-size:12.5px;cursor:pointer}
.actions .open:hover{background:#cdeee7;border-color:#7fccc0}
.empty,.loading{padding:60px 20px;text-align:center;color:#8aa39d;font-size:13.5px}
/* drawer */
.scrim{position:absolute;inset:58px 0 0 0;background:rgba(18,48,56,.28);display:none}
.scrim.show{display:block}
.drawer{position:absolute;top:0;right:0;bottom:0;width:460px;max-width:92vw;background:#fff;box-shadow:-14px 0 40px rgba(18,48,56,.18);display:none;flex-direction:column;border-left:1px solid var(--border);z-index:6}
.drawer.show{display:flex}
.dw-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid #eef4f2}
.dw-head h2{font-size:16px;display:flex;align-items:center;gap:10px}
.x{width:30px;height:30px;border:1px solid var(--border);border-radius:8px;background:#fff;color:#6f8b86;cursor:pointer;font-size:15px}
.dw-body{padding:20px 22px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.field label{display:block;font-size:12.5px;color:#5c766f;margin-bottom:7px;font-weight:600}
.field input,.field textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:13.5px;color:#123038;background:#fff;font-family:inherit}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.field textarea{min-height:80px;resize:vertical;line-height:1.55}
.hint{font-size:11.5px;color:#93a89f;margin-top:6px}
.metarow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metabox{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:#f8fcfb}
.metabox .k{font-size:11.5px;color:#6f8b86}.metabox .v{font-size:17px;font-weight:700;color:#234;margin-top:3px}
.sec-title{font-size:12px;color:#6f8b86;font-weight:600;letter-spacing:.3px;margin-bottom:10px}
.rules{display:flex;flex-wrap:wrap;gap:7px}
.rtag{background:#f4faf9;border:1px solid var(--border);border-radius:7px;padding:6px 10px;font-size:12px;color:#3f5f58;display:flex;gap:6px;align-items:center}
.rtag .rid{color:#a7c0ba;font-size:10.5px}
.statusseg{display:flex;gap:8px}
.seg{flex:1;text-align:center;padding:8px 0;border:1px solid var(--border);border-radius:9px;font-size:12.5px;color:#5c766f;cursor:pointer;background:#fff}
.seg.on{background:var(--teal-soft);border-color:#9fd8cf;color:var(--teal-d);font-weight:600}
.dw-foot{display:flex;align-items:center;gap:10px;padding:16px 22px;border-top:1px solid #eef4f2}
.dw-foot .grow{flex:1}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#123038;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.show{opacity:.95}
dialog{border:none;border-radius:14px;padding:0;box-shadow:0 20px 60px rgba(18,48,56,.28);width:min(420px,92vw)}
dialog::backdrop{background:rgba(18,48,56,.3)}
.dlg-head{padding:18px 22px 6px;font-size:16px;font-weight:700}
.dlg-body{padding:12px 22px;display:flex;flex-direction:column;gap:14px}
.dlg-foot{padding:14px 22px 20px;display:flex;justify-content:flex-end;gap:10px}
</style>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="brandwrap">
      <div class="brand"><div class="brand-mark">M</div><div><b>Mousika 规则编排</b><small>业务场景 / Rule Flows</small></div></div>
      <div class="tabs"><a class="tab on" href="/">业务场景</a><a class="tab" href="/rules">原子规则库</a></div>
    </div>
    <div class="top-right">
      <div class="search">🔍 <input id="searchInput" placeholder="搜索场景名称 / 描述"></div>
      <button class="btn primary" id="newFlowBtn">＋ 新建场景</button>
    </div>
  </div>
  <div class="main">
    <div class="page-head">
      <div><span style="font-size:19px;font-weight:700">业务场景</span><span class="sub" id="subCount">加载中…</span></div>
      <div class="filters" id="filters">
        <div class="chip on" data-status="">全部</div>
        <div class="chip" data-status="1">已生效</div>
        <div class="chip" data-status="0">已停用</div>
      </div>
    </div>
    <div class="panel">
      <table>
        <thead><tr><th style="width:42%">场景 / 描述</th><th>状态</th><th>引用规则</th><th>更新时间</th><th style="text-align:right">操作</th></tr></thead>
        <tbody id="rows"><tr><td colspan="5"><div class="loading">加载中…</div></td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer">
    <div class="dw-head"><h2>场景详情 <span class="pill live" id="dwStatusPill">已生效</span></h2><button class="x" id="dwClose">✕</button></div>
    <div class="dw-body">
      <div class="field"><label>场景名称</label><input id="dwName" maxlength="60"></div>
      <div class="field"><label>场景描述</label><textarea id="dwDesc" maxlength="500"></textarea><div class="hint">名称与描述保存后立即生效，不影响已编排的规则流程结构。</div></div>
      <div class="field"><label>状态</label><div class="statusseg"><div class="seg on" data-seg="1">已生效</div><div class="seg" data-seg="0">停用</div></div></div>
      <div>
        <div class="sec-title">概览</div>
        <div class="metarow">
          <div class="metabox"><div class="k">引用原子规则</div><div class="v" id="dwRuleCount">0</div></div>
          <div class="metabox"><div class="k">流程节点</div><div class="v" id="dwNodeCount">0</div></div>
          <div class="metabox"><div class="k">版本</div><div class="v" id="dwVersion">v0</div></div>
          <div class="metabox"><div class="k">最近更新</div><div class="v" id="dwUpdated" style="font-size:13px;padding-top:4px">-</div></div>
        </div>
      </div>
      <div>
        <div class="sec-title">引用的原子规则</div>
        <div class="rules" id="dwRules"></div>
      </div>
    </div>
    <div class="dw-foot"><button class="btn" id="dwCancel">取消</button><span class="grow"></span><button class="btn" id="dwSave">保存</button><button class="btn primary" id="dwOpen">打开规则画布 →</button></div>
  </aside>
</div>

<dialog id="newDlg">
  <div class="dlg-head">新建业务场景</div>
  <div class="dlg-body">
    <div class="field"><label>场景名称 *</label><input id="newName" placeholder="如：信贷准入风控"></div>
    <div class="field"><label>场景描述</label><textarea id="newDesc" placeholder="一句话说明这个场景做什么"></textarea></div>
  </div>
  <div class="dlg-foot"><button class="btn" id="newCancel">取消</button><button class="btn primary" id="newCreate">创建并打开画布</button></div>
</dialog>

<div class="toast" id="toast"></div>

<script src="/ui/treenode.js?v=20260731-3"></script>
<script src="/ui/api.js?v=20260731-3"></script>
<script>
(() => {
  "use strict";
  const T = window.MousikaTree, Api = window.MousikaApi;
  const $ = (s) => document.querySelector(s);
  let statusFilter = "";
  let keyword = "";
  let flows = [];
  let ruleNameById = new Map();
  let current = null; // drawer 当前 flow
  let drawerStatus = 1;

  const toast = (msg) => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1800); };
  const esc = (v) => String(v ?? "").replace(/[&<>'"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[c]));

  // 从 ruleTree JSON 统计引用的原子规则 id 与节点数。
  function analyze(ruleTreeJson) {
    const ids = new Set(); let nodes = 0;
    try {
      const root = T.deserialize(ruleTreeJson);
      T.visit(root, (n) => { nodes++; if (["R", "A", "C"].includes(n.type) && n.expr && n.expr !== "∅") ids.add(n.expr); });
    } catch (_) { /* ignore malformed */ }
    return { ids: [...ids], nodes };
  }

  async function loadRuleNames() {
    try {
      const page = await Api.listRules({ pageSize: 500 });
      (page.items || []).forEach((r) => ruleNameById.set(String(r.id), r.name || r.description || String(r.id)));
    } catch (_) { /* 下拉名称非关键 */ }
  }

  async function loadFlows() {
    $("#rows").innerHTML = `<tr><td colspan="5"><div class="loading">加载中…</div></td></tr>`;
    try {
      const page = await Api.listFlows({ status: statusFilter, keyword, pageSize: 200 });
      flows = page.items || [];
      $("#subCount").textContent = `共 ${page.total} 条 · 每条对应一棵可编排的规则流程`;
      renderRows();
    } catch (e) {
      $("#rows").innerHTML = `<tr><td colspan="5"><div class="empty">加载失败：${esc(e.message)}</div></td></tr>`;
    }
  }

  function renderRows() {
    if (!flows.length) { $("#rows").innerHTML = `<tr><td colspan="5"><div class="empty">暂无场景，点右上角「新建场景」开始。</div></td></tr>`; return; }
    $("#rows").innerHTML = flows.map((f) => {
      const a = analyze(f.ruleTree);
      const live = f.status === 1;
      const dim = live ? "" : ' style="opacity:.62"';
      const ops = live
        ? `<button class="open" data-open="${f.id}">打开画布</button><button class="btn link" data-detail="${f.id}">详情</button><button class="btn link danger" data-toggle="${f.id}" data-to="0">停用</button>`
        : `<button class="open" data-open="${f.id}">打开画布</button><button class="btn link" data-detail="${f.id}">详情</button><button class="btn link" data-toggle="${f.id}" data-to="1">启用</button>`;
      return `<tr${dim}>
        <td><div class="name">${esc(f.name)}<span class="id">#${f.id}</span></div><div class="rowdesc">${esc(f.description || "—")}</div></td>
        <td><span class="pill ${live ? "live" : "off"}">${live ? "已生效" : "已停用"}</span></td>
        <td class="num">${a.ids.length}</td>
        <td class="time">${esc((f.updatedAt || "").slice(5, 16))}</td>
        <td><div class="actions">${ops}</div></td>
      </tr>`;
    }).join("");
  }

  function openCanvas(id) { location.href = `/flow/${id}`; }

  function openDrawer(id) {
    current = flows.find((f) => f.id === id);
    if (!current) return;
    drawerStatus = current.status;
    $("#dwName").value = current.name || "";
    $("#dwDesc").value = current.description || "";
    $("#dwVersion").textContent = "v" + current.version;
    $("#dwUpdated").textContent = (current.updatedAt || "").slice(0, 16);
    const a = analyze(current.ruleTree);
    $("#dwRuleCount").textContent = a.ids.length;
    $("#dwNodeCount").textContent = a.nodes;
    $("#dwRules").innerHTML = a.ids.length
      ? a.ids.map((rid) => `<div class="rtag">${esc(ruleNameById.get(rid) || rid)}<span class="rid">#${esc(rid)}</span></div>`).join("")
      : `<span class="hint">未引用任何原子规则</span>`;
    setDrawerStatus(current.status);
    $("#scrim").classList.add("show"); $("#drawer").classList.add("show");
  }
  function closeDrawer() { $("#scrim").classList.remove("show"); $("#drawer").classList.remove("show"); current = null; }
  function setDrawerStatus(v) {
    drawerStatus = v;
    document.querySelectorAll("#drawer .seg").forEach((s) => s.classList.toggle("on", Number(s.dataset.seg) === v));
    const pill = $("#dwStatusPill"); pill.textContent = v === 1 ? "已生效" : "已停用"; pill.className = "pill " + (v === 1 ? "live" : "off");
  }

  async function saveDrawer(openAfter) {
    if (!current) return;
    const name = $("#dwName").value.trim();
    if (!name) { toast("场景名称不能为空"); return; }
    try {
      const updated = await Api.updateFlow(current.id, {
        id: current.id, name, description: $("#dwDesc").value.trim(),
        ruleTree: current.ruleTree, status: drawerStatus, version: current.version
      });
      toast("已保存");
      const id = current.id;
      closeDrawer();
      await loadFlows();
      if (openAfter) openCanvas(id);
    } catch (e) { toast("保存失败：" + e.message); }
  }

  async function toggleStatus(id, to) {
    const f = flows.find((x) => x.id === id); if (!f) return;
    try {
      if (to === 0) { await Api.disableFlow(id); }
      else { await Api.updateFlow(id, { id, name: f.name, description: f.description, ruleTree: f.ruleTree, status: 1, version: f.version }); }
      toast(to === 0 ? "已停用" : "已启用");
      loadFlows();
    } catch (e) { toast("操作失败：" + e.message); }
  }

  async function createFlow() {
    const name = $("#newName").value.trim();
    if (!name) { toast("请填写场景名称"); return; }
    try {
      const created = await Api.createFlow({
        name, description: $("#newDesc").value.trim(),
        ruleTree: JSON.stringify({ type: "T", expr: "", next: { type: "A", expr: "∅" } }), status: 1
      });
      $("#newDlg").close();
      openCanvas(created.id);
    } catch (e) { toast("创建失败：" + e.message); }
  }

  // events
  $("#rows").addEventListener("click", (e) => {
    const o = e.target.closest("[data-open]"); if (o) return openCanvas(Number(o.dataset.open));
    const d = e.target.closest("[data-detail]"); if (d) return openDrawer(Number(d.dataset.detail));
    const t = e.target.closest("[data-toggle]"); if (t) return toggleStatus(Number(t.dataset.toggle), Number(t.dataset.to));
  });
  $("#filters").addEventListener("click", (e) => {
    const chip = e.target.closest(".chip"); if (!chip) return;
    document.querySelectorAll("#filters .chip").forEach((c) => c.classList.remove("on"));
    chip.classList.add("on"); statusFilter = chip.dataset.status; loadFlows();
  });
  let searchTimer;
  $("#searchInput").addEventListener("input", (e) => { keyword = e.target.value.trim(); clearTimeout(searchTimer); searchTimer = setTimeout(loadFlows, 250); });
  $("#dwClose").addEventListener("click", closeDrawer);
  $("#dwCancel").addEventListener("click", closeDrawer);
  $("#scrim").addEventListener("click", closeDrawer);
  $("#dwSave").addEventListener("click", () => saveDrawer(false));
  $("#dwOpen").addEventListener("click", () => saveDrawer(true));
  document.querySelectorAll("#drawer .seg").forEach((s) => s.addEventListener("click", () => setDrawerStatus(Number(s.dataset.seg))));
  $("#newFlowBtn").addEventListener("click", () => { $("#newName").value = ""; $("#newDesc").value = ""; $("#newDlg").showModal(); requestAnimationFrame(() => $("#newName").focus()); });
  $("#newCancel").addEventListener("click", () => $("#newDlg").close());
  $("#newCreate").addEventListener("click", createFlow);

  (async () => { await loadRuleNames(); await loadFlows(); })();
})();
</script>
</body>
</html>
